<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Aero Bondi Glass Outer -->
    <linearGradient id="aeroGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8eaff"/>
      <stop offset="35%" stop-color="#48cae4"/>
      <stop offset="70%" stop-color="#0096c7"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>

    <!-- Aero Screen Glass -->
    <linearGradient id="aeroScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0fbfc"/>
      <stop offset="40%" stop-color="#98e2ed"/>
      <stop offset="70%" stop-color="#2a9d8f"/>
      <stop offset="100%" stop-color="#1b4965"/>
    </linearGradient>

    <!-- Top Gloss White Arc -->
    <linearGradient id="glossWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Eye Glow -->
    <filter id="aeroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Headphone Arc Band (Glossy Aqua) -->
  <path d="M 28 58 C 28 20, 100 20, 100 58" fill="none" stroke="#0077b6" stroke-width="7" stroke-linecap="round"/>
  <path d="M 30 56 C 30 22, 98 22, 98 56" fill="none" stroke="#caf0f8" stroke-width="2" stroke-linecap="round"/>

  <!-- Antenna with Glowing Orb -->
  <path d="M 64 24 Q 68 12, 60 7" fill="none" stroke="#48cae4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="59" cy="6" r="4.5" fill="#38ef7d" filter="url(#aeroGlow)"/>
  <circle cx="58" cy="5" r="1.5" fill="#ffffff"/>

  <!-- Left Headphone Ear-cup -->
  <rect x="14" y="44" width="12" height="34" rx="6" fill="#0096c7" stroke="#caf0f8" stroke-width="1.5"/>
  <rect x="17" y="49" width="4" height="24" rx="2" fill="#52b788" filter="url(#aeroGlow)"/>

  <!-- Right Headphone Ear-cup -->
  <rect x="102" y="44" width="12" height="34" rx="6" fill="#0096c7" stroke="#caf0f8" stroke-width="1.5"/>
  <rect x="107" y="49" width="4" height="24" rx="2" fill="#52b788" filter="url(#aeroGlow)"/>

  <!-- Main Monitor Body (Frosted Aqua Glass) -->
  <rect x="24" y="24" width="80" height="74" rx="22" fill="url(#aeroGlass)" stroke="#caf0f8" stroke-width="1.8"/>

  <!-- Specular Top Gloss Highlight -->
  <path d="M 28 26 Q 64 34, 100 26 Q 96 46, 28 46 Z" fill="url(#glossWhite)" rx="18"/>

  <!-- Screen Outer Rim (Subtle Metal/Glass Bezel) -->
  <rect x="30" y="30" width="68" height="62" rx="16" fill="#012a4a" stroke="#caf0f8" stroke-width="1.2"/>

  <!-- Inner CRT Screen (Aquatic Glowing Glass) -->
  <rect x="33" y="33" width="62" height="56" rx="13" fill="url(#aeroScreen)"/>

  <!-- Screen Top Curved Lens Reflection -->
  <path d="M 35 35 Q 64 45, 93 35 Q 86 48, 35 48 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Cute Glowing Eyes (Emerald/Aqua Smile Arches) -->
  <path d="M 44 58 C 44 50, 56 50, 56 58" fill="none" stroke="#2dc653" stroke-width="4.5" stroke-linecap="round" filter="url(#aeroGlow)"/>
  <path d="M 72 58 C 72 50, 84 50, 84 58" fill="none" stroke="#2dc653" stroke-width="4.5" stroke-linecap="round" filter="url(#aeroGlow)"/>

  <!-- Cute Digital Smile -->
  <path d="M 59 69 Q 64 74, 69 69" fill="none" stroke="#2dc653" stroke-width="3" stroke-linecap="round" filter="url(#aeroGlow)"/>

  <!-- Little Body Feet / Base (Clear Aqua Glass) -->
  <rect x="38" y="99" width="18" height="9" rx="4.5" fill="#0077b6" stroke="#caf0f8" stroke-width="1"/>
  <rect x="72" y="99" width="18" height="9" rx="4.5" fill="#0077b6" stroke="#caf0f8" stroke-width="1"/>

  <!-- Small EFI Chest Branding -->
  <text x="64" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" opacity="0.8" text-anchor="middle" letter-spacing="1">EFI</text>
</svg>
