<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <!-- Rust Horizon: post-apocalyptic desert backdrop with dust-veiled solar disc,
       layered canyon mesas, salvage relay masts and warm ochre wind haze. -->
  <defs>
    <linearGradient id="rhSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0806"/>
      <stop offset="42%" stop-color="#170f0b"/>
      <stop offset="76%" stop-color="#2b1910"/>
      <stop offset="100%" stop-color="#120c09"/>
    </linearGradient>

    <radialGradient id="rhDustSun" cx="65%" cy="44%" r="45%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.38"/>
      <stop offset="28%" stop-color="#fb923c" stop-opacity="0.2"/>
      <stop offset="62%" stop-color="#c2410c" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#120c09" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rhHaze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fb923c" stop-opacity="0.14"/>
      <stop offset="80%" stop-color="#eab308" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>

    <pattern id="rhDiagHatch" width="24" height="24" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#fb923c" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Scorched Sky Canvas -->
  <rect width="1920" height="1080" fill="url(#rhSky)"/>
  <rect width="1920" height="1080" fill="url(#rhDiagHatch)"/>
  <rect width="1920" height="1080" fill="url(#rhDustSun)"/>

  <!-- Dust-Filtered Low Sun & Telemetry Rings -->
  <g transform="translate(1248, 475)">
    <circle cx="0" cy="0" r="135" fill="#fb923c" opacity="0.16"/>
    <circle cx="0" cy="0" r="92" fill="#fdba74" opacity="0.22"/>
    <circle cx="0" cy="0" r="185" fill="none" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="18 10" opacity="0.3"/>
    <circle cx="0" cy="0" r="240" fill="none" stroke="#eab308" stroke-width="0.8" stroke-dasharray="4 12" opacity="0.22"/>
    <circle cx="0" cy="0" r="305" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="32 16 6 16" opacity="0.2"/>
    <line x1="-350" y1="0" x2="-150" y2="0" stroke="#fb923c" stroke-width="1" opacity="0.28"/>
    <line x1="150" y1="0" x2="350" y2="0" stroke="#fb923c" stroke-width="1" opacity="0.28"/>
    <line x1="0" y1="-350" x2="0" y2="-150" stroke="#fb923c" stroke-width="1" opacity="0.28"/>
    <line x1="0" y1="150" x2="0" y2="350" stroke="#fb923c" stroke-width="1" opacity="0.28"/>
  </g>

  <!-- Topographic Wasteland Survey Contours (Upper Left) -->
  <g fill="none" stroke="#fb923c" opacity="0.14">
    <path d="M-20,180 C160,140 320,240 510,190 C700,140 860,220 1040,160" stroke-width="1.2"/>
    <path d="M-20,230 C180,190 340,290 540,240 C740,190 890,270 1080,210" stroke-width="1" stroke-dasharray="10 6"/>
    <path d="M-20,280 C200,240 360,340 570,290 C780,240 920,320 1120,260" stroke-width="0.8"/>
    <circle cx="330" cy="215" r="70" stroke-width="1" stroke-dasharray="6 6"/>
    <circle cx="330" cy="215" r="35" stroke="#eab308" stroke-width="0.8"/>
  </g>

  <!-- Abandoned Wind Turbine Silhouettes (Far Horizon) -->
  <g stroke="#fb923c" stroke-width="1.2" fill="none" opacity="0.25">
    <line x1="280" y1="760" x2="280" y2="620"/>
    <line x1="280" y1="620" x2="245" y2="590"/>
    <line x1="280" y1="620" x2="320" y2="600"/>
    <line x1="280" y1="620" x2="275" y2="665"/>
    <line x1="1580" y1="735" x2="1580" y2="585"/>
    <line x1="1580" y1="585" x2="1540" y2="555"/>
    <line x1="1580" y1="585" x2="1625" y2="570"/>
    <line x1="1580" y1="585" x2="1575" y2="635"/>
  </g>

  <!-- Windblown Sand Strata Bands -->
  <rect x="0" y="420" width="1920" height="90" fill="url(#rhHaze)"/>
  <rect x="0" y="560" width="1920" height="70" fill="url(#rhHaze)" opacity="0.7"/>

  <!-- Distant Canyon Mesas & Buttes -->
  <path d="M0,760 L140,760 L195,650 L390,650 L445,745 L720,745 L785,615 L1040,615 L1105,735 L1410,735 L1470,635 L1690,635 L1750,740 L1920,740 L1920,1080 L0,1080 Z" fill="#1b110c" opacity="0.92"/>

  <!-- Salvage Radio Relay Towers & Power Lines -->
  <g stroke="#fb923c" stroke-width="1.4" fill="none" opacity="0.32">
    <!-- Tower 1 -->
    <polygon points="560,745 575,520 590,745"/>
    <line x1="552" y1="565" x2="598" y2="565"/>
    <line x1="556" y1="610" x2="594" y2="610"/>
    <!-- Tower 2 -->
    <polygon points="1310,735 1325,495 1340,735"/>
    <line x1="1300" y1="540" x2="1350" y2="540"/>
    <line x1="1305" y1="590" x2="1345" y2="590"/>
    <!-- Catenary Cable -->
    <path d="M575,565 Q950,670 1325,540" stroke-width="0.9" stroke-dasharray="6 4"/>
  </g>

  <!-- Foreground Dune & Scrap Ridge -->
  <path d="M0,845 C240,810 490,860 760,830 C1030,800 1310,855 1590,820 C1740,805 1840,825 1920,815 L1920,1080 L0,1080 Z" fill="#140d09"/>
  <path d="M0,915 C320,885 660,930 1010,895 C1360,860 1650,910 1920,885 L1920,1080 L0,1080 Z" fill="#0e0907"/>

  <!-- Drifting Sand Motes -->
  <g fill="#fdba74" opacity="0.45">
    <circle cx="220" cy="690" r="1.5"/>
    <circle cx="480" cy="580" r="1.8"/>
    <circle cx="740" cy="530" r="1.3"/>
    <circle cx="1090" cy="560" r="2"/>
    <circle cx="1450" cy="510" r="1.6"/>
    <circle cx="1710" cy="590" r="1.4"/>
  </g>
</svg>
