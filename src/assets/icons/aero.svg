<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Drop Shadows -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#034878" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#022842" flood-opacity="0.3"/>
    </filter>

    <filter id="padShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#023054" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#01182a" flood-opacity="0.3"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip Path for the Rounded Squircle Badge -->
    <clipPath id="badgeClip">
      <rect x="28" y="28" width="456" height="456" rx="116" ry="116"/>
    </clipPath>

    <!-- Sky Background Gradient: Windows Vista / 7 Morning Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1472c4"/>
      <stop offset="25%" stop-color="#2a8de2"/>
      <stop offset="55%" stop-color="#60baf4"/>
      <stop offset="80%" stop-color="#a6ddfb"/>
      <stop offset="100%" stop-color="#e2f4ff"/>
    </linearGradient>

    <!-- Sun Flare in top-right -->
    <radialGradient id="sunBloom" cx="80%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#fff8db" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Rolling Green Hill at Bottom -->
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7cd33a"/>
      <stop offset="45%" stop-color="#46ad25"/>
      <stop offset="100%" stop-color="#207a16"/>
    </linearGradient>

    <!-- Light Aurora Ribbon -->
    <linearGradient id="auroraRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#bbf7d0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Badge Glass Rim -->
    <linearGradient id="badgeRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#cbe8fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Controller Body: 3D Glossy White Ceramic / Pearlescent Glass -->
    <linearGradient id="padBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#f5faff"/>
      <stop offset="60%" stop-color="#d8ebf9"/>
      <stop offset="90%" stop-color="#beddf5"/>
      <stop offset="100%" stop-color="#a8d0ee"/>
    </linearGradient>

    <!-- Controller Top Specular Shine -->
    <linearGradient id="padTopSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Controller Rim Bevel -->
    <linearGradient id="padBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#93c5eb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4a95cf" stop-opacity="0.6"/>
    </linearGradient>

    <!-- D-Pad Metallic Sapphire -->
    <linearGradient id="dpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="48%" stop-color="#1d63c9"/>
      <stop offset="52%" stop-color="#10499b"/>
      <stop offset="100%" stop-color="#0c3673"/>
    </linearGradient>

    <!-- Center Buttons Aqua Glass -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Action Buttons Jewel Gradients -->
    <!-- Yellow / Y Button -->
    <radialGradient id="btnYellow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>

    <!-- Red / B Button -->
    <radialGradient id="btnRed" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- Green / A Button -->
    <radialGradient id="btnGreen" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>

    <!-- Blue / X Button -->
    <radialGradient id="btnBlue" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>

    <!-- Button Specular Cap -->
    <linearGradient id="btnGlossCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soap Bubble Shading -->
    <radialGradient id="soapBubble" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#e0f7ff" stop-opacity="0.2"/>
      <stop offset="90%" stop-color="#fbcfe8" stop-opacity="0.45"/>
      <stop offset="96%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Master Badge Top Crescent Gloss Highlight -->
    <linearGradient id="badgeTopGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Star Flare -->
    <radialGradient id="flareGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#e0f4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Reusable Bubble Def -->
    <g id="aeroBubble">
      <circle cx="0" cy="0" r="16" fill="url(#soapBubble)"/>
      <ellipse cx="-6" cy="-6" rx="5" ry="3" transform="rotate(-35 -6 -6)" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="7" cy="7" rx="2" ry="1" transform="rotate(-40 7 7)" fill="#ffffff" opacity="0.6"/>
    </g>
  </defs>

  <!-- ==================== BASE WITH SHADOW ==================== -->
  <rect x="28" y="28" width="456" height="456" rx="116" ry="116" fill="url(#skyGrad)" filter="url(#badgeShadow)"/>

  <!-- ==================== CLIPPED SCENE CONTENTS ==================== -->
  <g clip-path="url(#badgeClip)">
    <!-- Sun Bloom -->
    <rect x="28" y="28" width="456" height="456" fill="url(#sunBloom)"/>

    <!-- Aurora Ribbons -->
    <path d="M 28 320 C 120 280 200 310 290 260 S 420 180 484 150 L 484 185 C 420 215 360 285 280 305 S 140 335 28 360 Z" fill="url(#auroraRibbon)"/>
    <path d="M 28 370 C 140 330 240 360 330 310 S 440 240 484 220 L 484 235 C 440 255 350 325 280 345 S 140 380 28 395 Z" fill="url(#auroraRibbon)" opacity="0.6"/>

    <!-- Rolling Green Hill at Bottom -->
    <path d="M 0 500 L 0 440 C 110 405 210 415 300 435 C 370 450 430 436 512 426 L 512 512 L 0 512 Z" fill="url(#hillGrad)"/>
    <path d="M 0 440 C 110 405 210 415 300 435 C 370 450 430 436 512 426" fill="none" stroke="#e9ffd0" stroke-width="3" stroke-opacity="0.85"/>

    <!-- Floating Soap Bubbles in Background -->
    <use href="#aeroBubble" x="90" y="160" transform="scale(1.4) translate(-25, -45)"/>
    <use href="#aeroBubble" x="410" y="340" transform="scale(1.1) translate(-37, -30)"/>
    <use href="#aeroBubble" x="395" y="140" transform="scale(0.8) translate(50, 35)"/>
    <use href="#aeroBubble" x="110" y="380" transform="scale(0.7) translate(47, 162)"/>

    <!-- ==================== 2. THE GAME CONTROLLER ==================== -->
    <g filter="url(#padShadow)">
      <!-- Controller Body Outline (exact original silhouette, perfected geometry) -->
      <!-- Center (256, 260), width 340, height 228 -->
      <path d="
        M 190 162
        C 222 172, 290 172, 322 162
        C 362 150, 400 178, 410 218
        C 422 268, 434 322, 404 362
        C 382 392, 344 380, 326 338
        C 308 296, 282 284, 256 284
        C 230 284, 204 296, 186 338
        C 168 380, 130 392, 108 362
        C 78 322, 90 268, 102 218
        C 112 178, 150 150, 190 162
        Z"
        fill="url(#padBodyGrad)"
        stroke="url(#padBevel)"
        stroke-width="5"
      />

      <!-- Controller Upper Specular Shell Reflection -->
      <path d="
        M 190 164
        C 222 174, 290 174, 322 164
        C 358 152, 392 176, 404 212
        C 412 242, 416 276, 402 305
        C 390 260, 345 220, 256 220
        C 167 220, 122 260, 110 305
        C 96 276, 100 242, 108 212
        C 120 176, 154 152, 190 164
        Z"
        fill="url(#padTopSheen)"
      />

      <!-- Grip Crease Insets (Original Accent Lines) -->
      <!-- Left Grip Crease -->
      <path d="M 124 330 C 138 355, 156 366, 168 354" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <path d="M 124 330 C 138 355, 156 366, 168 354" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <!-- Right Grip Crease -->
      <path d="M 388 330 C 374 355, 356 366, 344 354" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <path d="M 388 330 C 374 355, 356 366, 344 354" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <!-- ==================== CONTROLLER CONTROLS ==================== -->

      <!-- 1. D-PAD (Left Side, x=168, y=242) -->
      <g transform="translate(168, 242)">
        <!-- D-Pad Well Drop Shadow -->
        <path d="M -10 -28 L 10 -28 L 10 -10 L 28 -10 L 28 10 L 10 10 L 10 28 L -10 28 L -10 10 L -28 10 L -28 -10 L -10 -10 Z" fill="#093558" opacity="0.4" transform="translate(0, 3)"/>
        <!-- D-Pad Body -->
        <path d="M -10 -28 L 10 -28 L 10 -10 L 28 -10 L 28 10 L 10 10 L 10 28 L -10 28 L -10 10 L -28 10 L -28 -10 L -10 -10 Z" 
              fill="url(#dpadGrad)" 
              stroke="#ffffff" 
              stroke-width="2"
              stroke-opacity="0.85"/>
        <!-- Directional Arrow Carats -->
        <!-- Up -->
        <polygon points="0,-23 -5,-16 5,-16" fill="#ffffff" opacity="0.9"/>
        <!-- Down -->
        <polygon points="0,23 -5,16 5,16" fill="#ffffff" opacity="0.9"/>
        <!-- Left -->
        <polygon points="-23,0 -16,-5 -16,5" fill="#ffffff" opacity="0.9"/>
        <!-- Right -->
        <polygon points="23,0 16,-5 16,5" fill="#ffffff" opacity="0.9"/>
        <!-- Center Dish -->
        <circle cx="0" cy="0" r="7" fill="#0c3673" opacity="0.5"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
      </g>

      <!-- 2. CENTER PILL BUTTONS (Select / Start) -->
      <rect x="224" y="252" width="20" height="9" rx="4.5" fill="#093558" opacity="0.3" transform="translate(0, 2)"/>
      <rect x="224" y="252" width="20" height="9" rx="4.5" fill="url(#pillGrad)" stroke="#ffffff" stroke-width="1.2"/>
      <ellipse cx="234" cy="254.5" rx="7" ry="2" fill="#ffffff" opacity="0.75"/>

      <rect x="268" y="252" width="20" height="9" rx="4.5" fill="#093558" opacity="0.3" transform="translate(0, 2)"/>
      <rect x="268" y="252" width="20" height="9" rx="4.5" fill="url(#pillGrad)" stroke="#ffffff" stroke-width="1.2"/>
      <ellipse cx="278" cy="254.5" rx="7" ry="2" fill="#ffffff" opacity="0.75"/>

      <!-- 3. CENTER AERO LOGO ORB (Xbox/PS Guide Nexus) -->
      <g transform="translate(256, 218)">
        <circle cx="0" cy="0" r="16" fill="#082b4a" opacity="0.4" transform="translate(0, 2)"/>
        <circle cx="0" cy="0" r="16" fill="url(#pillGrad)" stroke="#ffffff" stroke-width="2"/>
        <!-- Glowing Core -->
        <circle cx="0" cy="0" r="12" fill="url(#sunBloom)"/>
        <circle cx="0" cy="0" r="7" fill="#ffffff" filter="url(#glowCyan)"/>
        <!-- Glossy Crescent -->
        <path d="M -13 0 C -13 -8 -8 -13 0 -13 C 8 -13 13 -8 13 0 C 7 -4 -7 -4 -13 0 Z" fill="#ffffff" opacity="0.85"/>
      </g>

      <!-- 4. ACTION BUTTONS (Right Side, Diamond around x=344, y=242) -->
      <!-- Top Button: Yellow (Y) at (344, 216) -->
      <g transform="translate(344, 216)">
        <circle cx="0" cy="0" r="13" fill="#082b4a" opacity="0.35" transform="translate(0, 2.5)"/>
        <circle cx="0" cy="0" r="13" fill="url(#btnYellow)" stroke="#ffffff" stroke-width="1.5"/>
        <ellipse cx="-2" cy="-4" rx="7" ry="4" transform="rotate(-25 -2 -4)" fill="url(#btnGlossCap)"/>
        <text x="0" y="4.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.5))">Y</text>
      </g>

      <!-- Right Button: Red (B) at (370, 242) -->
      <g transform="translate(370, 242)">
        <circle cx="0" cy="0" r="13" fill="#082b4a" opacity="0.35" transform="translate(0, 2.5)"/>
        <circle cx="0" cy="0" r="13" fill="url(#btnRed)" stroke="#ffffff" stroke-width="1.5"/>
        <ellipse cx="-2" cy="-4" rx="7" ry="4" transform="rotate(-25 -2 -4)" fill="url(#btnGlossCap)"/>
        <text x="0" y="4.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.5))">B</text>
      </g>

      <!-- Bottom Button: Green (A) at (344, 268) -->
      <g transform="translate(344, 268)">
        <circle cx="0" cy="0" r="13" fill="#082b4a" opacity="0.35" transform="translate(0, 2.5)"/>
        <circle cx="0" cy="0" r="13" fill="url(#btnGreen)" stroke="#ffffff" stroke-width="1.5"/>
        <ellipse cx="-2" cy="-4" rx="7" ry="4" transform="rotate(-25 -2 -4)" fill="url(#btnGlossCap)"/>
        <text x="0" y="4.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.5))">A</text>
      </g>

      <!-- Left Button: Blue (X) at (318, 242) -->
      <g transform="translate(318, 242)">
        <circle cx="0" cy="0" r="13" fill="#082b4a" opacity="0.35" transform="translate(0, 2.5)"/>
        <circle cx="0" cy="0" r="13" fill="url(#btnBlue)" stroke="#ffffff" stroke-width="1.5"/>
        <ellipse cx="-2" cy="-4" rx="7" ry="4" transform="rotate(-25 -2 -4)" fill="url(#btnGlossCap)"/>
        <text x="0" y="4.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.5))">X</text>
      </g>
    </g>

    <!-- ==================== 3. MASTER AERO GLASS CRESCENT ==================== -->
    <path d="
      M 30 144
      C 30 75, 75 30, 150 30
      L 362 30
      C 437 30, 482 75, 482 144
      C 482 230, 420 270, 340 270
      C 170 270, 40 210, 30 144
      Z"
      fill="url(#badgeTopGloss)"
    />

    <!-- Top Rim Lens Highlight -->
    <ellipse cx="256" cy="38" rx="160" ry="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Rim Highlight on Top of Everything -->
  <rect x="30" y="30" width="452" height="452" rx="114" ry="114" fill="none" stroke="url(#badgeRim)" stroke-width="4"/>

  <!-- ==================== 4. STAR SPARKLES ==================== -->
  <!-- Top Left Sparkle -->
  <g transform="translate(142, 95)">
    <circle cx="0" cy="0" r="22" fill="url(#flareGlow)"/>
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#ffffff"/>
  </g>

  <!-- Controller Shoulder Sparkle -->
  <g transform="translate(205, 160) scale(0.7)">
    <circle cx="0" cy="0" r="18" fill="url(#flareGlow)"/>
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#ffffff"/>
  </g>

  <!-- Bottom Right Gem Sparkle -->
  <g transform="translate(420, 380) scale(0.65)">
    <circle cx="0" cy="0" r="18" fill="url(#flareGlow)"/>
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#ffffff"/>
  </g>
</svg>
