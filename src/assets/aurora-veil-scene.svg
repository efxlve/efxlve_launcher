<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <!-- Aurora Veil: abstract polar night sky, sweeping geomagnetic light ribbons,
       crystalline starfield and distant fjord ridge silhouettes. -->
  <defs>
    <linearGradient id="avSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03070e"/>
      <stop offset="45%" stop-color="#07101c"/>
      <stop offset="80%" stop-color="#0b1829"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>

    <radialGradient id="avCyanBloom" cx="68%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.24"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.11"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#07101c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="avVioletBloom" cx="26%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.09"/>
      <stop offset="75%" stop-color="#4c1d95" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#07101c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="avRibbonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="25%" stop-color="#67e8f9" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="80%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="avRibbonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c4b5fd" stop-opacity="0.24"/>
      <stop offset="65%" stop-color="#67e8f9" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="avCurtain" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="85%" stop-color="#a78bfa" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#07101c" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="avIceMist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#040911" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- Polar Night Base -->
  <rect width="1920" height="1080" fill="url(#avSky)"/>
  <rect width="1920" height="1080" fill="url(#avCyanBloom)"/>
  <rect width="1920" height="1080" fill="url(#avVioletBloom)"/>

  <!-- High Latitude Starfield -->
  <g fill="#e0f2fe" opacity="0.55">
    <circle cx="95" cy="70" r="1.1"/>
    <circle cx="210" cy="145" r="0.8"/>
    <circle cx="340" cy="60" r="1.4"/>
    <circle cx="480" cy="190" r="1"/>
    <circle cx="615" cy="88" r="1.2"/>
    <circle cx="760" cy="130" r="0.9"/>
    <circle cx="910" cy="55" r="1.5"/>
    <circle cx="1065" cy="115" r="1"/>
    <circle cx="1220" cy="75" r="1.3"/>
    <circle cx="1370" cy="160" r="0.8"/>
    <circle cx="1510" cy="65" r="1.4"/>
    <circle cx="1660" cy="120" r="1.1"/>
    <circle cx="1810" cy="82" r="1.3"/>
    <circle cx="145" cy="290" r="0.9"/>
    <circle cx="420" cy="310" r="1.2"/>
    <circle cx="835" cy="240" r="1"/>
    <circle cx="1295" cy="275" r="1.1"/>
    <circle cx="1730" cy="255" r="0.9"/>
  </g>

  <!-- Sweeping Geomagnetic Aurora Curtains -->
  <g opacity="0.85">
    <path d="M-80,460 C220,320 460,520 780,360 C1100,200 1380,420 1680,260 C1800,195 1910,210 2000,240 L2000,90 C1860,60 1720,85 1580,150 C1280,290 1040,95 720,240 C400,385 180,210 -80,330 Z" fill="url(#avRibbonCyan)"/>
    <path d="M-60,580 C260,450 540,610 880,440 C1220,270 1510,470 1840,320 L1980,270 L1980,140 C1680,290 1360,120 1020,290 C680,460 390,310 60,440 Z" fill="url(#avRibbonViolet)"/>
    <path d="M120,520 C420,380 680,510 980,350 C1280,190 1560,340 1860,210 L1860,80 C1560,210 1280,60 980,220 C680,380 420,250 120,390 Z" fill="url(#avCurtain)" opacity="0.7"/>
  </g>

  <!-- Vertical Magnetic Ray Filaments -->
  <g stroke="#a5f3fc" stroke-linecap="round" opacity="0.18">
    <line x1="280" y1="180" x2="295" y2="470" stroke-width="2"/>
    <line x1="340" y1="210" x2="352" y2="490" stroke-width="1.2"/>
    <line x1="640" y1="150" x2="655" y2="430" stroke-width="2.5"/>
    <line x1="710" y1="130" x2="722" y2="410" stroke-width="1.5"/>
    <line x1="1080" y1="120" x2="1095" y2="400" stroke-width="2.2"/>
    <line x1="1150" y1="145" x2="1162" y2="420" stroke-width="1.4"/>
    <line x1="1490" y1="110" x2="1505" y2="380" stroke-width="2.6"/>
    <line x1="1560" y1="135" x2="1572" y2="395" stroke-width="1.5"/>
  </g>

  <!-- Subtle Polar Astrolabe Arc (Top Right) -->
  <g transform="translate(1620, 220)" opacity="0.16" fill="none" stroke="#67e8f9">
    <circle cx="0" cy="0" r="230" stroke-width="0.7" stroke-dasharray="3 9"/>
    <circle cx="0" cy="0" r="190" stroke-width="1" stroke-dasharray="6 10"/>
    <circle cx="0" cy="0" r="135" stroke-width="1.2" stroke-dasharray="28 14"/>
    <circle cx="0" cy="0" r="75" stroke-width="0.8" stroke="#a78bfa"/>
    <circle cx="0" cy="0" r="32" stroke-width="1" stroke="#34d399" stroke-dasharray="4 6"/>
    <line x1="-250" y1="0" x2="250" y2="0" stroke-width="0.6" opacity="0.6"/>
    <line x1="0" y1="-250" x2="0" y2="250" stroke-width="0.6" opacity="0.6"/>
    <line x1="-160" y1="-160" x2="160" y2="160" stroke-width="0.5" opacity="0.4"/>
    <line x1="160" y1="-160" x2="-160" y2="160" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Secondary Geomagnetic Compass (Bottom Left) -->
  <g transform="translate(260, 620)" opacity="0.12" fill="none" stroke="#a78bfa">
    <circle cx="0" cy="0" r="140" stroke-width="1" stroke-dasharray="12 8"/>
    <circle cx="0" cy="0" r="95" stroke-width="0.8" stroke="#67e8f9"/>
    <circle cx="0" cy="0" r="45" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="-165" y1="0" x2="165" y2="0" stroke-width="0.6"/>
    <line x1="0" y1="-165" x2="0" y2="165" stroke-width="0.6"/>
  </g>

  <!-- Distant Fjord Mountain Ranges -->
  <path d="M0,810 L180,735 L370,790 L590,695 L820,780 L1060,680 L1290,770 L1540,665 L1760,750 L1920,705 L1920,1080 L0,1080 Z" fill="#081322" opacity="0.92"/>
  <path d="M0,865 C220,830 410,855 640,820 C870,785 1120,845 1380,805 C1610,770 1780,815 1920,795 L1920,1080 L0,1080 Z" fill="#060e1a"/>

  <!-- Frozen Fjord Reflection & Horizon Mist -->
  <g opacity="0.22">
    <ellipse cx="640" cy="965" rx="340" ry="14" fill="#67e8f9"/>
    <ellipse cx="1360" cy="940" rx="420" ry="18" fill="#a78bfa"/>
    <ellipse cx="1020" cy="1010" rx="520" ry="12" fill="#38bdf8"/>
  </g>
  <rect x="0" y="760" width="1920" height="320" fill="url(#avIceMist)"/>
</svg>
