<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Xbox 360 backdrop: a dark console-green room lit by one lime glow, with
       two glass "blades" sweeping across it. Gradients only, no filters: the
       scene is rasterised once behind the app and must stay cheap. -->
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04120a"/>
      <stop offset="0.45" stop-color="#08220f"/>
      <stop offset="0.8" stop-color="#0d2e14"/>
      <stop offset="1" stop-color="#123a19"/>
    </linearGradient>
    <radialGradient id="glow" cx="1180" cy="880" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6ef5c" stop-opacity="0.62"/>
      <stop offset="0.3" stop-color="#8ec63f" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#4c8a22" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0a1f0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="120" cy="140" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9bd44a" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#4b8a24" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#04120a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeA" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#e6ffc4" stop-opacity="0.24"/>
      <stop offset="0.62" stop-color="#b6ef5c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7cbf2a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bladeB" x1="0" y1="1" x2="1" y2="0.2">
      <stop offset="0" stop-color="#7cbf2a" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#c8f57a" stop-opacity="0.18"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="800" cy="520" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#room)"/>
  <rect width="1600" height="1000" fill="url(#glowLeft)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- The two blades the 360 dashboard slid between. -->
  <path d="M-120 760 C 240 560, 640 470, 1080 470 L 1720 470 L 1720 620 C 1180 640, 700 720, 240 900 L -120 900 Z" fill="url(#bladeA)"/>
  <path d="M-120 430 C 300 330, 780 300, 1220 330 L 1720 360 L 1720 470 C 1240 450, 700 500, 200 640 L -120 690 Z" fill="url(#bladeB)"/>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
