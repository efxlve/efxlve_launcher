<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Cyberlife: Detroit Android & Holographic Telemetry Backdrop
       Inspired by Detroit: Become Human: sleek CyberLife corporate minimalism,
       the iconic temple circular LED halo, probability calculation brackets,
       and futuristic android UI telemetry.
       Built with pure SVG gradients and vectors for crisp, GPU-efficient rendering. -->
  <defs>
    <!-- Deep corporate android slate base -->
    <linearGradient id="clBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="50%" stop-color="#090e18"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>

    <!-- Top-right Android LED Ring Glow -->
    <radialGradient id="clLedGlow" cx="1620" cy="220" r="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00a2ff" stop-opacity="0.18"/>
      <stop offset="25%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#05080e" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom-left software stability cyan glow -->
    <radialGradient id="clCyanGlow" cx="300" cy="880" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="35%" stop-color="#0ea5e9" stop-opacity="0.04"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#05080e" stop-opacity="0"/>
    </radialGradient>

    <!-- Holographic Telemetry Hex-Dot Grid -->
    <pattern id="clGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.8" fill="#00a2ff" fill-opacity="0.05"/>
    </pattern>

    <!-- Corner L-Bracket for Telemetry -->
    <g id="clCornerBracket">
      <path d="M 0 35 L 0 0 L 35 0" fill="none" stroke="#00a2ff" stroke-width="1.5" opacity="0.45"/>
      <rect x="3" y="3" width="3" height="3" fill="#38bdf8" opacity="0.6"/>
    </g>
  </defs>

  <!-- Base Slate & Atmosphere Glows -->
  <rect width="1920" height="1080" fill="url(#clBase)"/>
  <rect width="1920" height="1080" fill="url(#clGrid)"/>
  <rect width="1920" height="1080" fill="url(#clLedGlow)"/>
  <rect width="1920" height="1080" fill="url(#clCyanGlow)"/>

  <!-- ==================== TOP-RIGHT ICONIC ANDROID TEMPLE LED RING ==================== -->
  <g transform="translate(1640, 220)">
    <!-- Outer ambient LED corona -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00a2ff" stroke-width="28" opacity="0.04"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#38bdf8" stroke-width="14" opacity="0.08"/>
    <!-- The crisp circular LED status ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#00a2ff" stroke-width="4" opacity="0.5"/>
    <!-- Active glowing segment (processing loop) -->
    <path d="M 0 -75 A 75 75 0 0 1 75 0" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
    <!-- Inner pulse ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#00a2ff" stroke-width="1" opacity="0.3" stroke-dasharray="4 6"/>
    <!-- Center CyberLife Status Triangle -->
    <polygon points="0,-18 16,14 -16,14" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.45"/>
    <!-- Telemetry Readout below the ring -->
    <text x="0" y="108" text-anchor="middle" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="#38bdf8" opacity="0.6">STATUS: OPERATIONAL</text>
    <text x="0" y="122" text-anchor="middle" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="8.5" letter-spacing="1" fill="#93a4be" opacity="0.4">BIORP-SYSTEM: NORMAL</text>
  </g>

  <!-- ==================== HORIZONTAL HOLO SCAN GUIDES ==================== -->
  <g opacity="0.2">
    <line x1="50" y1="46" x2="1870" y2="46" stroke="#00a2ff" stroke-width="1" stroke-dasharray="12 4 2 4"/>
    <line x1="50" y1="1034" x2="1870" y2="1034" stroke="#00a2ff" stroke-width="1" stroke-dasharray="8 8"/>
  </g>

  <!-- ==================== TOP-LEFT CYBERLIFE TELEMETRY ==================== -->
  <g transform="translate(60, 50)">
    <use href="#clCornerBracket"/>
    <text x="48" y="16" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#38bdf8" opacity="0.65">CYBERLIFE // ANDROID ARCHITECTURE v4.2</text>
    <text x="48" y="30" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="9" letter-spacing="1.2" fill="#93a4be" opacity="0.4">MODEL: RK800 // SERIAL: #313 248 317 - 51</text>
  </g>

  <!-- ==================== PROBABILITY OF SUCCESS / RECONSTRUCTION ENGINE ==================== -->
  <!-- The signature Detroit reconstruction probability readout -->
  <g transform="translate(80, 880)" opacity="0.4">
    <!-- Probability box -->
    <rect x="0" y="0" width="220" height="42" fill="rgba(0, 162, 255, 0.05)" stroke="#00a2ff" stroke-width="1" rx="2"/>
    <text x="14" y="18" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#93a4be">PROBABILITY OF SUCCESS</text>
    <text x="14" y="34" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="14" font-weight="800" letter-spacing="1.5" fill="#38bdf8">98%</text>
    <!-- Mini progress meter -->
    <rect x="75" y="24" width="130" height="6" fill="rgba(0, 162, 255, 0.2)" rx="1"/>
    <rect x="75" y="24" width="127" height="6" fill="#38bdf8" rx="1"/>
    <!-- Software instability indicator -->
    <text x="0" y="60" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="9" letter-spacing="1" fill="#38bdf8">SOFTWARE INSTABILITY ^</text>
  </g>

  <!-- ==================== BOTTOM-RIGHT CYBERLIFE LOGO WATERMARK ==================== -->
  <g transform="translate(1860, 1030)">
    <use href="#clCornerBracket" transform="rotate(180)"/>
    <g transform="translate(-180, -22)" opacity="0.3">
      <!-- Minimalist CyberLife stylized C logo -->
      <path d="M 0 0 A 14 14 0 1 1 0 16" fill="none" stroke="#00a2ff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="8" r="4" fill="#38bdf8"/>
      <text x="24" y="12" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="2" fill="#00a2ff">CYBERLIFE</text>
    </g>
  </g>
</svg>
