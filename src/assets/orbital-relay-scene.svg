<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <!-- Orbital Relay: space-opera mood backdrop with planetary atmosphere limb,
       orbital transit rings, star-chart vectors and telemetry coordinates. -->
  <defs>
    <linearGradient id="orVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060d"/>
      <stop offset="50%" stop-color="#060b16"/>
      <stop offset="100%" stop-color="#0a1326"/>
    </linearGradient>

    <radialGradient id="orPlanetLimb" cx="50%" cy="132%" r="78%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="72%" stop-color="#071226"/>
      <stop offset="86%" stop-color="#0284c7" stop-opacity="0.38"/>
      <stop offset="91%" stop-color="#38bdf8" stop-opacity="0.62"/>
      <stop offset="94%" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#060b16" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orNebula" cx="22%" cy="26%" r="48%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060b16" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orArcLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="orSectorGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1920" height="1080" fill="url(#orVoid)"/>
  <rect width="1920" height="1080" fill="url(#orSectorGrid)"/>
  <rect width="1920" height="1080" fill="url(#orNebula)"/>

  <!-- Deep Field Stars -->
  <g fill="#e0f2fe" opacity="0.6">
    <circle cx="110" cy="90" r="1.2"/>
    <circle cx="265" cy="180" r="0.9"/>
    <circle cx="390" cy="75" r="1.4"/>
    <circle cx="540" cy="240" r="1"/>
    <circle cx="710" cy="110" r="1.3"/>
    <circle cx="885" cy="65" r="0.9"/>
    <circle cx="1050" cy="160" r="1.5"/>
    <circle cx="1230" cy="85" r="1.1"/>
    <circle cx="1410" cy="200" r="1.2"/>
    <circle cx="1580" cy="95" r="1.4"/>
    <circle cx="1760" cy="145" r="1"/>
    <circle cx="1845" cy="270" r="1.3"/>
    <circle cx="175" cy="390" r="1.1"/>
    <circle cx="620" cy="360" r="0.8"/>
    <circle cx="1140" cy="330" r="1.2"/>
    <circle cx="1640" cy="370" r="1"/>
  </g>

  <!-- Orbital Transit Trajectory Rings -->
  <g fill="none">
    <ellipse cx="960" cy="1160" rx="1240" ry="620" stroke="url(#orArcLine)" stroke-width="2"/>
    <ellipse cx="960" cy="1160" rx="1080" ry="520" stroke="#38bdf8" stroke-width="1" stroke-dasharray="14 10" opacity="0.32"/>
    <ellipse cx="960" cy="1160" rx="1390" ry="710" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 12" opacity="0.28"/>
  </g>

  <!-- Planetary Atmosphere Curvature -->
  <rect width="1920" height="1080" fill="url(#orPlanetLimb)"/>

  <!-- Relay Station Navigation Compass (Top Right) -->
  <g transform="translate(1540, 290)" opacity="0.24" fill="none" stroke="#38bdf8">
    <circle cx="0" cy="0" r="215" stroke-width="0.8" stroke-dasharray="6 10"/>
    <circle cx="0" cy="0" r="160" stroke-width="1.2" stroke-dasharray="24 8 4 8"/>
    <circle cx="0" cy="0" r="115" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="82" stroke-width="1" stroke-dasharray="12 6"/>
    <circle cx="0" cy="0" r="55" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" stroke="#7dd3fc" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
    <polygon points="0,-160 14,-14 160,0 14,14 0,160 -14,14 -160,0 -14,-14" stroke-width="0.8" opacity="0.6"/>
    <line x1="-245" y1="0" x2="-65" y2="0" stroke-width="1"/>
    <line x1="65" y1="0" x2="245" y2="0" stroke-width="1"/>
    <line x1="0" y1="-245" x2="0" y2="-65" stroke-width="1"/>
    <line x1="0" y1="65" x2="0" y2="245" stroke-width="1"/>
    <line x1="-140" y1="-140" x2="-45" y2="-45" stroke-width="0.8"/>
    <line x1="45" y1="45" x2="140" y2="140" stroke-width="0.8"/>
    <line x1="140" y1="-140" x2="45" y2="-45" stroke-width="0.8"/>
    <line x1="-45" y1="45" x2="-140" y2="140" stroke-width="0.8"/>
  </g>

  <!-- Secondary Telemetry Star Chart & Constellation Vectors (Left Side) -->
  <g opacity="0.22" fill="none" stroke="#818cf8">
    <polyline points="140,210 290,145 460,220 610,135 790,215 940,150" stroke-width="1" stroke-dasharray="5 5"/>
    <polyline points="290,145 370,310 580,295 610,135" stroke-width="0.8" stroke="#38bdf8"/>
    <circle cx="140" cy="210" r="4" fill="#38bdf8"/>
    <circle cx="290" cy="145" r="5" fill="#818cf8"/>
    <circle cx="460" cy="220" r="4" fill="#38bdf8"/>
    <circle cx="610" cy="135" r="5" fill="#7dd3fc"/>
    <circle cx="790" cy="215" r="4" fill="#818cf8"/>
    <circle cx="940" cy="150" r="4" fill="#38bdf8"/>
    <circle cx="370" cy="310" r="3.5" fill="#38bdf8"/>
    <circle cx="580" cy="295" r="3.5" fill="#818cf8"/>
  </g>

  <!-- Orbital Docking Gate Frame (Mid-Left Horizon) -->
  <g transform="translate(360, 560)" opacity="0.18" fill="none" stroke="#38bdf8">
    <polygon points="-90,-50 0,-105 90,-50 90,50 0,105 -90,50" stroke-width="1.4"/>
    <polygon points="-62,-35 0,-72 62,-35 62,35 0,72 -62,35" stroke="#818cf8" stroke-width="1"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke-width="0.8" stroke-dasharray="6 4"/>
  </g>

  <!-- Relay Beacon Nodes along the Orbital Ring -->
  <g fill="#7dd3fc">
    <circle cx="340" cy="622" r="4" opacity="0.85"/>
    <circle cx="340" cy="622" r="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
    <circle cx="960" cy="540" r="4.5" opacity="0.9"/>
    <circle cx="960" cy="540" r="15" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <circle cx="1580" cy="622" r="4" opacity="0.85"/>
    <circle cx="1580" cy="622" r="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  </g>
</svg>
