<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Headphone Band -->
  <path d="M 28 62 C 28 26, 100 26, 100 62" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
  <!-- Antenna with Orb -->
  <path d="M 64 26 L 64 12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="9" r="4.5" fill="currentColor"/>
  <!-- Ear cups -->
  <rect x="14" y="46" width="12" height="34" rx="6" fill="currentColor"/>
  <rect x="102" y="46" width="12" height="34" rx="6" fill="currentColor"/>
  <!-- Main Face Body -->
  <rect x="26" y="28" width="76" height="72" rx="22" fill="currentColor"/>
  <!-- Cutout Smiling Eyes (Transparent Negative Space) -->
  <path d="M 44 60 C 44 50, 56 50, 56 60" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <path d="M 72 60 C 72 50, 84 50, 84 60" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Cutout Smile -->
  <path d="M 59 74 Q 64 80, 69 74" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
