<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <!-- Verdant Hearth: cozy tea-house light backdrop with warm bamboo-paper wash,
       wooden shoji lattice geometry, gentle matcha hills and drifting leaves. -->
  <defs>
    <linearGradient id="vhPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f9f4"/>
      <stop offset="52%" stop-color="#f1f5ee"/>
      <stop offset="100%" stop-color="#e5ede0"/>
    </linearGradient>

    <radialGradient id="vhSunbeam" cx="75%" cy="22%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#86efac" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f1f5ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vhSageWash" cx="20%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#166534" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#15803d" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f1f5ee" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="vhMatchaHill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8e6d2"/>
      <stop offset="100%" stop-color="#c6dac0"/>
    </linearGradient>

    <pattern id="vhShoji" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#166534" stroke-width="0.7" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Warm Steamed-Paper Base -->
  <rect width="1920" height="1080" fill="url(#vhPaper)"/>
  <rect width="1920" height="1080" fill="url(#vhShoji)"/>
  <rect width="1920" height="1080" fill="url(#vhSunbeam)"/>
  <rect width="1920" height="1080" fill="url(#vhSageWash)"/>

  <!-- Traditional Round Window (Marumado) Motif (Top Right) -->
  <g transform="translate(1470, 295)" fill="none" stroke="#166534" opacity="0.16">
    <circle cx="0" cy="0" r="245" stroke-width="1" stroke-dasharray="8 10"/>
    <circle cx="0" cy="0" r="210" stroke-width="2"/>
    <circle cx="0" cy="0" r="196" stroke-width="0.9"/>
    <!-- Bamboo Lattice Inside Window -->
    <line x1="-145" y1="-145" x2="-145" y2="145" stroke-width="1.2"/>
    <line x1="-75" y1="-182" x2="-75" y2="182" stroke-width="1.2"/>
    <line x1="25" y1="-194" x2="25" y2="194" stroke-width="1"/>
    <line x1="95" y1="-172" x2="95" y2="172" stroke-width="1"/>
    <line x1="-182" y1="-75" x2="182" y2="-75" stroke-width="1.2"/>
    <line x1="-194" y1="0" x2="194" y2="0" stroke-width="1"/>
    <line x1="-145" y1="75" x2="145" y2="75" stroke-width="1.2"/>
  </g>

  <!-- Botanical Kumiko Geometric Medallion (Mid Left) -->
  <g transform="translate(320, 430)" fill="none" stroke="#15803d" opacity="0.14">
    <circle cx="0" cy="0" r="155" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="115" stroke-width="0.9" stroke-dasharray="6 6"/>
    <polygon points="0,-155 134,77 -134,77" stroke-width="1"/>
    <polygon points="0,155 134,-77 -134,-77" stroke-width="1"/>
    <polygon points="-110,-110 110,-110 110,110 -110,110" stroke-width="0.8"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke-width="0.8"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke-width="0.8"/>
  </g>

  <!-- Distant Cedar Ridge & Pagoda Eaves Silhouette -->
  <path d="M0,745 C260,690 540,780 860,720 C1180,660 1510,750 1920,695 L1920,1080 L0,1080 Z" fill="#e2ecd9" opacity="0.65"/>

  <!-- Sweeping Breeze Lines -->
  <g fill="none" stroke="#15803d" stroke-linecap="round" opacity="0.16">
    <path d="M80,440 C420,360 760,510 1140,410 C1420,335 1680,390 1880,340" stroke-width="2"/>
    <path d="M160,510 C510,430 850,565 1230,475 C1510,410 1720,450 1890,405" stroke-width="1.2" stroke-dasharray="10 8"/>
  </g>

  <!-- Rolling Tea Terrace Hills -->
  <path d="M0,805 C310,735 640,835 980,770 C1320,705 1640,795 1920,745 L1920,1080 L0,1080 Z" fill="url(#vhMatchaHill)" opacity="0.75"/>
  <path d="M0,885 C380,830 760,915 1140,860 C1480,810 1740,875 1920,845 L1920,1080 L0,1080 Z" fill="#bdd3b6" opacity="0.88"/>

  <!-- Floating Tea Leaves -->
  <g fill="#166534" opacity="0.22">
    <path d="M360,370 Q385,350 400,375 Q375,395 360,370 Z"/>
    <path d="M720,450 Q745,430 760,455 Q735,475 720,450 Z"/>
    <path d="M1110,340 Q1135,320 1150,345 Q1125,365 1110,340 Z"/>
    <path d="M1340,480 Q1365,460 1380,485 Q1355,505 1340,480 Z"/>
    <path d="M1650,390 Q1675,370 1690,395 Q1665,415 1650,390 Z"/>
  </g>
</svg>
