<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusDarkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="nexusDarkWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="nexusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top E bar extending into X diagonal -->
  <path d="M 20 28 L 68 28 L 108 82 L 90 82 L 56 38 L 20 38 Z" fill="url(#nexusDarkCyan)" filter="url(#nexusGlow)"/>

  <!-- Bottom E bar extending into X diagonal -->
  <path d="M 20 100 L 68 100 L 108 46 L 90 46 L 56 90 L 20 90 Z" fill="url(#nexusDarkCyan)" filter="url(#nexusGlow)"/>

  <!-- Center E core needle -->
  <path d="M 20 59 L 52 59 L 44 69 L 20 69 Z" fill="url(#nexusDarkWhite)"/>

  <!-- Right X front accents -->
  <polygon points="98,32 108,46 94,46 84,32" fill="#00f0ff" filter="url(#nexusGlow)"/>
  <polygon points="98,96 108,82 94,82 84,96" fill="#00f0ff" filter="url(#nexusGlow)"/>
</svg>
