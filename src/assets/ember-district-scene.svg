<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <!-- Ember District: cyberpunk megacity night backdrop with monolithic tower
       silhouettes, neon coral-rose horizon glow and diagonal rain telemetry. -->
  <defs>
    <linearGradient id="edSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060409"/>
      <stop offset="50%" stop-color="#0a070d"/>
      <stop offset="82%" stop-color="#1a0e1a"/>
      <stop offset="100%" stop-color="#0c070f"/>
    </linearGradient>

    <radialGradient id="edEmberBloom" cx="70%" cy="36%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.26"/>
      <stop offset="38%" stop-color="#f43f5e" stop-opacity="0.12"/>
      <stop offset="75%" stop-color="#881337" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a070d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="edStreetGlow" cx="28%" cy="84%" r="44%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ff6b35" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a070d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edNeonBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ff6b35" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>

    <pattern id="edHexDot" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="19" y="19" width="2" height="2" fill="#ff6b35" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Night Metropolis Canvas -->
  <rect width="1920" height="1080" fill="url(#edSky)"/>
  <rect width="1920" height="1080" fill="url(#edHexDot)"/>
  <rect width="1920" height="1080" fill="url(#edEmberBloom)"/>
  <rect width="1920" height="1080" fill="url(#edStreetGlow)"/>

  <!-- Holographic Sector Reticle (Top Right) -->
  <g transform="translate(1480, 320)" opacity="0.22" fill="none" stroke="#ff6b35">
    <circle cx="0" cy="0" r="245" stroke-width="0.8" stroke-dasharray="6 12"/>
    <circle cx="0" cy="0" r="190" stroke-width="1.2" stroke-dasharray="20 10 4 10"/>
    <circle cx="0" cy="0" r="140" stroke="#f43f5e" stroke-width="1" stroke-dasharray="6 8"/>
    <circle cx="0" cy="0" r="88" stroke-width="1"/>
    <circle cx="0" cy="0" r="36" stroke="#f43f5e" stroke-width="1.4"/>
    <polygon points="0,-110 95,55 -95,55" stroke-width="1"/>
    <polygon points="0,110 95,-55 -95,-55" stroke="#f43f5e" stroke-width="0.8"/>
    <line x1="-275" y1="0" x2="275" y2="0" stroke-width="0.8" stroke-dasharray="12 6"/>
    <line x1="0" y1="-275" x2="0" y2="275" stroke-width="0.8" stroke-dasharray="12 6"/>
    <line x1="-175" y1="-175" x2="175" y2="175" stroke-width="0.6" opacity="0.6"/>
    <line x1="175" y1="-175" x2="-175" y2="175" stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- District Transit Grid & Sector Framing (Upper Left) -->
  <g transform="translate(220, 240)" opacity="0.18" fill="none" stroke="#f43f5e">
    <polygon points="-110,-65 0,-130 110,-65 110,65 0,130 -110,65" stroke-width="1.2"/>
    <polygon points="-75,-44 0,-88 75,-44 75,44 0,88 -75,44" stroke="#ff6b35" stroke-width="1" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="32" stroke="#ff6b35" stroke-width="1.2"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke-width="0.8"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke-width="0.8"/>
  </g>

  <!-- Diagonal Neon Rain Vectors -->
  <g stroke="#ff8c5a" stroke-width="1.1" stroke-linecap="round" opacity="0.2">
    <line x1="210" y1="90" x2="160" y2="240"/>
    <line x1="380" y1="140" x2="330" y2="290"/>
    <line x1="590" y1="70" x2="540" y2="220"/>
    <line x1="820" y1="160" x2="770" y2="310"/>
    <line x1="1060" y1="95" x2="1010" y2="245"/>
    <line x1="1290" y1="180" x2="1240" y2="330"/>
    <line x1="1640" y1="110" x2="1590" y2="260"/>
    <line x1="1790" y1="210" x2="1740" y2="360"/>
  </g>

  <!-- Megacity Megastructure Skyline Silhouette -->
  <g fill="#0e0914" stroke="rgba(255, 107, 53, 0.16)" stroke-width="1">
    <rect x="80" y="610" width="110" height="470"/>
    <rect x="210" y="540" width="145" height="540"/>
    <polygon points="380,1080 380,470 460,410 510,410 510,1080"/>
    <rect x="540" y="590" width="130" height="490"/>
    <polygon points="980,1080 980,450 1040,370 1130,370 1130,1080"/>
    <rect x="1160" y="520" width="155" height="560"/>
    <polygon points="1345,1080 1345,390 1420,310 1495,390 1495,1080"/>
    <rect x="1525" y="560" width="140" height="520"/>
    <rect x="1695" y="490" width="160" height="590"/>
  </g>

  <!-- Aerial Transit Highway Beams -->
  <rect x="0" y="740" width="1920" height="3" fill="url(#edNeonBeam)"/>
  <rect x="0" y="810" width="1920" height="2" fill="url(#edNeonBeam)" opacity="0.7"/>

  <!-- Tower Beacon Lights -->
  <g fill="#ff6b35" opacity="0.75">
    <rect x="405" y="450" width="38" height="4" rx="2"/>
    <rect x="1015" y="415" width="52" height="4" rx="2" fill="#f43f5e"/>
    <rect x="1395" y="365" width="48" height="4" rx="2"/>
    <rect x="1730" y="525" width="64" height="4" rx="2" fill="#f43f5e"/>
  </g>
</svg>
