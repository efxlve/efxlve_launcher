<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="prismDarkTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="prismDarkLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="prismDarkRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top Hexagon Facet -->
  <polygon points="64,18 106,42 64,66 22,42" fill="url(#prismDarkTop)" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Left Facet -->
  <polygon points="22,42 64,66 64,110 22,86" fill="url(#prismDarkLeft)" stroke="#334155" stroke-width="1.2"/>

  <!-- Right Facet -->
  <polygon points="64,66 106,42 106,86 64,110" fill="url(#prismDarkRight)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Center Core Power Diamond -->
  <circle cx="64" cy="66" r="14" fill="#07080c" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 54 66 L 74 66 M 64 56 L 64 76" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" filter="url(#prismGlow)"/>
</svg>
