<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Neon grid: HUD-style backdrop
       Authentic in-game cyberware telemetry, precision optical reticles,
       CD Projekt Red acid yellow (#FCEE0A) and warning Red (#FF003C) accents. -->
  <defs>
    <!-- Deep carbon graphite base gradient -->
    <linearGradient id="cpBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Top-right acid-yellow ambient glow -->
    <radialGradient id="cpYellowGlow" cx="1620" cy="180" r="850" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcee0a" stop-opacity="0.12"/>
      <stop offset="35%" stop-color="#fcee0a" stop-opacity="0.04"/>
      <stop offset="70%" stop-color="#fcee0a" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom-left red ambient glow -->
    <radialGradient id="cpRedGlow" cx="280" cy="920" r="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#ff003c" stop-opacity="0.03"/>
      <stop offset="75%" stop-color="#ff003c" stop-opacity="0.005"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan central pulse -->
    <radialGradient id="cpCyanGlow" cx="960" cy="540" r="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.03"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.005"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Telemetry Micro-Dot Grid Pattern -->
    <pattern id="cpDotGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1" fill="#fcee0a" fill-opacity="0.06"/>
    </pattern>

    <!-- Diagonal Hazard Caution Stripe Pattern -->
    <pattern id="cpHazardStripe" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="20" fill="#fcee0a" fill-opacity="0.14"/>
      <rect x="10" width="10" height="20" fill="#000000" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Base Slate & Atmospheric Glows -->
  <rect width="1920" height="1080" fill="url(#cpBase)"/>
  <rect width="1920" height="1080" fill="url(#cpDotGrid)"/>
  <rect width="1920" height="1080" fill="url(#cpYellowGlow)"/>
  <rect width="1920" height="1080" fill="url(#cpRedGlow)"/>
  <rect width="1920" height="1080" fill="url(#cpCyanGlow)"/>

  <!-- ==================== HUD HORIZONTAL GUIDES ==================== -->
  <g opacity="0.22">
    <!-- Top Telemetry Guideline -->
    <line x1="60" y1="50" x2="1860" y2="50" stroke="#fcee0a" stroke-width="1" stroke-dasharray="8 4 2 4"/>
    <!-- Bottom Telemetry Guideline -->
    <line x1="60" y1="1030" x2="1860" y2="1030" stroke="#fcee0a" stroke-width="1" stroke-dasharray="12 6 2 6"/>
  </g>

  <!-- ==================== TOP-LEFT HUD BRACKET ==================== -->
  <g transform="translate(60, 50)">
    <!-- Corner Bracket -->
    <path d="M 0 45 L 0 0 L 45 0" fill="none" stroke="#fcee0a" stroke-width="2" opacity="0.5"/>
    <rect x="4" y="4" width="4" height="4" fill="#fcee0a" opacity="0.6"/>
    <!-- Status Telemetry -->
    <text x="55" y="14" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#fcee0a" opacity="0.45">KIROSHI OPTICS // NEURAL LINK v2.0</text>
    <text x="55" y="28" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="9" letter-spacing="1" fill="#a6acb8" opacity="0.35">BIOS: NC-7749-X // SYNCED</text>
    <!-- Calibration ticks -->
    <line x1="0" y1="15" x2="6" y2="15" stroke="#fcee0a" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="30" x2="6" y2="30" stroke="#fcee0a" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- ==================== TOP-RIGHT HUD BRACKET ==================== -->
  <g transform="translate(1860, 50)">
    <!-- Corner Bracket -->
    <path d="M 0 45 L 0 0 L -45 0" fill="none" stroke="#fcee0a" stroke-width="2" opacity="0.5"/>
    <rect x="-8" y="4" width="4" height="4" fill="#ff003c" opacity="0.7"/>
    <!-- Danger / Arasaka Telemetry -->
    <text x="-55" y="14" text-anchor="end" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#ff003c" opacity="0.55">SEC-LVL // RESTRICTED ACCESS</text>
    <text x="-55" y="28" text-anchor="end" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="9" letter-spacing="1" fill="#fcee0a" opacity="0.35">ICE FIREWALL: ACTIVE</text>
    <!-- Hazard caution stripe accent bar -->
    <rect x="-240" y="-12" width="180" height="6" fill="url(#cpHazardStripe)" rx="1"/>
  </g>

  <!-- ==================== BOTTOM-LEFT HUD BRACKET ==================== -->
  <g transform="translate(60, 1030)">
    <!-- Corner Bracket -->
    <path d="M 0 -45 L 0 0 L 45 0" fill="none" stroke="#ff003c" stroke-width="2" opacity="0.5"/>
    <rect x="4" y="-8" width="4" height="4" fill="#ff003c" opacity="0.6"/>
    <!-- warning Ghost Watermark -->
    <g opacity="0.2">
      <path d="M 12 -42 L 28 -42 L 36 -28 L 20 -28 Z" fill="#ff003c"/>
      <path d="M 12 -24 L 28 -24 L 32 -14 L 16 -14 Z" fill="#fcee0a"/>
    </g>
  </g>

  <!-- ==================== BOTTOM-RIGHT HUD BRACKET ==================== -->
  <g transform="translate(1860, 1030)">
    <!-- Corner Bracket -->
    <path d="M 0 -45 L 0 0 L -45 0" fill="none" stroke="#fcee0a" stroke-width="2" opacity="0.5"/>
    <rect x="-8" y="-8" width="4" height="4" fill="#fcee0a" opacity="0.6"/>
    <!-- High-Tech Barcode Stamp -->
    <g transform="translate(-160, -38)" opacity="0.25">
      <rect x="0" y="0" width="3" height="24" fill="#fcee0a"/>
      <rect x="6" y="0" width="1" height="24" fill="#fcee0a"/>
      <rect x="10" y="0" width="4" height="24" fill="#fcee0a"/>
      <rect x="18" y="0" width="2" height="24" fill="#fcee0a"/>
      <rect x="23" y="0" width="5" height="24" fill="#fcee0a"/>
      <rect x="31" y="0" width="1" height="24" fill="#fcee0a"/>
      <rect x="35" y="0" width="3" height="24" fill="#fcee0a"/>
      <rect x="42" y="0" width="6" height="24" fill="#fcee0a"/>
      <rect x="51" y="0" width="2" height="24" fill="#fcee0a"/>
      <rect x="56" y="0" width="4" height="24" fill="#fcee0a"/>
      <rect x="63" y="0" width="1" height="24" fill="#fcee0a"/>
      <rect x="68" y="0" width="5" height="24" fill="#fcee0a"/>
      <rect x="76" y="0" width="2" height="24" fill="#fcee0a"/>
      <rect x="81" y="0" width="3" height="24" fill="#fcee0a"/>
      <rect x="88" y="0" width="7" height="24" fill="#fcee0a"/>
      <text x="0" y="32" font-family="'Consolas', monospace" font-size="7" letter-spacing="2" fill="#fcee0a">77-NIGHTCITY-V</text>
    </g>
    <text x="-175" y="-18" text-anchor="end" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#fcee0a" opacity="0.45">BUFFER: 100%</text>
    <text x="-175" y="-6" text-anchor="end" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="9" letter-spacing="1" fill="#00f0ff" opacity="0.4">LATENCY: 0.12ms // NOMINAL</text>
  </g>

  <!-- ==================== KIROSHI RETICLE (Top-Right Background) ==================== -->
  <g transform="translate(1560, 360)" opacity="0.12">
    <!-- Outer segmented circular reticle -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#fcee0a" stroke-width="1.5" stroke-dasharray="14 10 4 10"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#fcee0a" stroke-width="0.75" stroke-dasharray="2 6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#fcee0a" stroke-width="1" stroke-dasharray="40 20"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ff003c" stroke-width="1"/>
    <!-- Crosshair reticles -->
    <line x1="-200" y1="0" x2="-100" y2="0" stroke="#fcee0a" stroke-width="1"/>
    <line x1="100" y1="0" x2="200" y2="0" stroke="#fcee0a" stroke-width="1"/>
    <line x1="0" y1="-200" x2="0" y2="-100" stroke="#fcee0a" stroke-width="1"/>
    <line x1="0" y1="100" x2="0" y2="200" stroke="#fcee0a" stroke-width="1"/>
    <!-- 45-degree corner ticks -->
    <line x1="-70" y1="-70" x2="-55" y2="-55" stroke="#fcee0a" stroke-width="1.5"/>
    <line x1="55" y1="55" x2="70" y2="70" stroke="#fcee0a" stroke-width="1.5"/>
    <line x1="55" y1="-55" x2="70" y2="-70" stroke="#fcee0a" stroke-width="1.5"/>
    <line x1="-70" y1="70" x2="-55" y2="55" stroke="#fcee0a" stroke-width="1.5"/>
    <!-- Micro degree markers -->
    <text x="96" y="-6" font-family="'Consolas', monospace" font-size="8" fill="#fcee0a">090°</text>
    <text x="-6" y="-96" font-family="'Consolas', monospace" font-size="8" fill="#fcee0a">000°</text>
    <text x="-124" y="-6" font-family="'Consolas', monospace" font-size="8" fill="#fcee0a">270°</text>
    <text x="-6" y="104" font-family="'Consolas', monospace" font-size="8" fill="#fcee0a">180°</text>
  </g>

  <!-- ==================== SECONDARY RETICLE (Bottom-Left Background) ==================== -->
  <g transform="translate(360, 720)" opacity="0.08">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ff003c" stroke-width="1" stroke-dasharray="12 12"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#00f0ff" stroke-width="0.75"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#00f0ff" stroke-width="0.75"/>
  </g>

  <!-- Vignette dark edge mask -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="1" opacity="0.5"/>
</svg>
