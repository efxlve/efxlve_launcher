<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark Subterranean Lab Base Gradient -->
    <linearGradient id="labBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06080a"/>
      <stop offset="50%" stop-color="#0a0d12"/>
      <stop offset="85%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>

    <!-- Resonance Cascade / Anomalous Core Radiation Aura -->
    <radialGradient id="portalCoreAura" cx="75%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.32"/>
      <stop offset="30%" stop-color="#ea580c" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06080a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="singularityCore" cx="75%" cy="38%" r="18%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#fdba74" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Caution Hazard Stripes Pattern -->
    <pattern id="hazardStripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#f97316" fill-opacity="0.35"/>
      <rect x="20" width="20" height="40" fill="#0d1117" fill-opacity="0.75"/>
    </pattern>

    <!-- Subtle Lab Grid -->
    <pattern id="tacticalGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(249, 115, 22, 0.04)" stroke-width="1"/>
      <circle cx="80" cy="0" r="1.5" fill="rgba(249, 115, 22, 0.15)"/>
    </pattern>

    <!-- Steel Plate Sheen -->
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161c24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1f2733" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#141920" stop-opacity="0.95"/>
    </linearGradient>

    <!-- HEV Orange Glow Stroke -->
    <linearGradient id="orangeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1920" height="1080" fill="url(#labBg)"/>
  <rect width="1920" height="1080" fill="url(#tacticalGrid)"/>

  <!-- Anomalous Energy Core / Resonance Cascade Glow -->
  <rect width="1920" height="1080" fill="url(#portalCoreAura)"/>
  <circle cx="1440" cy="410" r="280" fill="url(#singularityCore)"/>

  <!-- High-Energy Particle Ionization Rays (Anti-Mass Spectrometer Emission) -->
  <g opacity="0.6">
    <line x1="1440" y1="410" x2="800" y2="180" stroke="url(#orangeStroke)" stroke-width="1.8" stroke-dasharray="8 12"/>
    <line x1="1440" y1="410" x2="1100" y2="820" stroke="url(#orangeStroke)" stroke-width="1.4" stroke-dasharray="6 10"/>
    <line x1="1440" y1="410" x2="1820" y2="240" stroke="url(#orangeStroke)" stroke-width="1.6" stroke-dasharray="10 14"/>
    <line x1="1440" y1="410" x2="1780" y2="720" stroke="url(#orangeStroke)" stroke-width="1.2" stroke-dasharray="4 8"/>
    <!-- Xen Dimensional Fluorescent Particles -->
    <circle cx="1320" cy="340" r="2.5" fill="#34d399" opacity="0.75"/>
    <circle cx="1520" cy="320" r="2" fill="#34d399" opacity="0.65"/>
    <circle cx="1480" cy="490" r="3" fill="#fde047" opacity="0.8"/>
    <circle cx="1380" cy="460" r="2.2" fill="#fed7aa" opacity="0.85"/>
    <circle cx="1410" cy="300" r="1.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="1560" cy="440" r="2.4" fill="#fb923c" opacity="0.7"/>
    <circle cx="1260" cy="420" r="1.5" fill="#34d399" opacity="0.6"/>
  </g>

  <!-- Heavy Industrial Girders & Overhead Catwalk Architecture -->
  <g id="industrialOverhead">
    <!-- Top Reinforced Blast Ceiling Truss -->
    <rect x="0" y="0" width="1920" height="42" fill="#0c1015"/>
    <line x1="0" y1="42" x2="1920" y2="42" stroke="rgba(249, 115, 22, 0.4)" stroke-width="2"/>
    <!-- Safety Warning Stripe on Ceiling Beam -->
    <rect x="0" y="44" width="1920" height="8" fill="url(#hazardStripes)"/>
    <line x1="0" y1="52" x2="1920" y2="52" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1"/>

    <!-- Diagonal Steel Structural Trusses (Left and Right) -->
    <g stroke="rgba(30, 41, 59, 0.85)" stroke-width="12" fill="none">
      <line x1="0" y1="52" x2="320" y2="520"/>
      <line x1="320" y1="52" x2="0" y2="520"/>
      <line x1="1600" y1="52" x2="1920" y2="520"/>
      <line x1="1920" y1="52" x2="1600" y2="520"/>
    </g>
    <!-- Truss Inset Wireframe Highlight -->
    <g stroke="rgba(249, 115, 22, 0.2)" stroke-width="1.5" fill="none">
      <line x1="0" y1="52" x2="320" y2="520"/>
      <line x1="320" y1="52" x2="0" y2="520"/>
      <line x1="1600" y1="52" x2="1920" y2="520"/>
      <line x1="1920" y1="52" x2="1600" y2="520"/>
    </g>
  </g>

  <!-- Giant Chamber Containment Ring Silhouette (Spectrometer Ring) -->
  <g id="spectrometerChamber" transform="translate(1440, 410)">
    <!-- Outer Rotor Ring -->
    <circle cx="0" cy="0" r="320" fill="none" stroke="rgba(249, 115, 22, 0.2)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="305" fill="none" stroke="rgba(249, 115, 22, 0.4)" stroke-width="1" stroke-dasharray="16 8 4 8"/>
    <!-- Magnet Support Nodes (8 Emitters) -->
    <rect x="-16" y="-335" width="32" height="30" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <rect x="-16" y="305" width="32" height="30" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <rect x="-335" y="-16" width="30" height="32" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <rect x="305" y="-16" width="30" height="32" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <!-- Middle Inner Ring with Tachometer Tick Marks -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8" stroke-dasharray="2 6"/>
  </g>

  <!-- Industrial Catwalk & Ventilation Pipe Work (Lower Silhouettes) -->
  <g id="catwalkBottom">
    <!-- Massive Subfloor Blast Deck -->
    <path d="M0,860 L1920,860 L1920,1080 L0,1080 Z" fill="#0d1117"/>
    <!-- Catwalk Handrail -->
    <line x1="0" y1="810" x2="1920" y2="810" stroke="rgba(249, 115, 22, 0.35)" stroke-width="2"/>
    <line x1="0" y1="835" x2="1920" y2="835" stroke="rgba(249, 115, 22, 0.2)" stroke-width="1.5"/>
    <!-- Stanchions -->
    <g stroke="rgba(249, 115, 22, 0.3)" stroke-width="2">
      <line x1="120" y1="810" x2="120" y2="860"/>
      <line x1="280" y1="810" x2="280" y2="860"/>
      <line x1="440" y1="810" x2="440" y2="860"/>
      <line x1="600" y1="810" x2="600" y2="860"/>
      <line x1="760" y1="810" x2="760" y2="860"/>
      <line x1="920" y1="810" x2="920" y2="860"/>
      <line x1="1080" y1="810" x2="1080" y2="860"/>
      <line x1="1240" y1="810" x2="1240" y2="860"/>
      <line x1="1400" y1="810" x2="1400" y2="860"/>
      <line x1="1560" y1="810" x2="1560" y2="860"/>
      <line x1="1720" y1="810" x2="1720" y2="860"/>
      <line x1="1880" y1="810" x2="1880" y2="860"/>
    </g>
    <!-- Deck Edge Hazard Striping -->
    <rect x="0" y="860" width="1920" height="12" fill="url(#hazardStripes)"/>
    <line x1="0" y1="872" x2="1920" y2="872" stroke="rgba(249, 115, 22, 0.5)" stroke-width="1.5"/>
  </g>

  <!-- Technical Telemetry & Hazmat HUD Readouts (Bottom Left & Center) -->
  <g id="resonanceTelemetry" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="11" fill="#f97316" opacity="0.6">
    <text x="240" y="930" letter-spacing="2">ANOMALOUS RESEARCH COMPLEX // SECTOR C</text>
    <text x="240" y="952" fill="#94a3b8" letter-spacing="1">SUBTERRANEAN PHYSICS LAB // TEST CHAMBER 07</text>
    <text x="240" y="974" fill="#34d399" letter-spacing="1.5">HAZMAT SUIT STATUS: OPTIMAL [ POWER: 100% ] [ RAD: 0.00 mSv ]</text>
    <text x="240" y="996" letter-spacing="2">CASCADE STABILIZATION GRID: ACTIVE // FREQ 104.7 MHz</text>
    
    <!-- Mini Technical Gauge -->
    <rect x="240" y="1012" width="180" height="6" fill="#1e293b" rx="1"/>
    <rect x="240" y="1012" width="145" height="6" fill="#f97316" rx="1"/>
    <text x="430" y="1018" font-size="9" fill="#f97316">SPECTROMETER 80%</text>
  </g>
</svg>
