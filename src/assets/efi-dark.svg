<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Dark Body Gradient -->
    <linearGradient id="bodyDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#343944"/>
      <stop offset="100%" stop-color="#1a1d24"/>
    </linearGradient>

    <!-- Bezel Inner Gradient -->
    <linearGradient id="bezelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16181f"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>

    <!-- Screen Glass Glow -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142636"/>
      <stop offset="50%" stop-color="#09121a"/>
      <stop offset="100%" stop-color="#050a0e"/>
    </linearGradient>

    <!-- Headphone Ring Glow -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Headphone Arc Band -->
  <path d="M 28 58 C 28 20, 100 20, 100 58" fill="none" stroke="#2b2f38" stroke-width="7" stroke-linecap="round"/>
  <path d="M 32 54 C 32 24, 96 24, 96 54" fill="none" stroke="#3d4350" stroke-width="2" stroke-linecap="round"/>

  <!-- Antenna -->
  <path d="M 64 24 Q 68 12, 60 7" fill="none" stroke="#2b2f38" stroke-width="3" stroke-linecap="round"/>
  <circle cx="59" cy="6" r="4.5" fill="#00f5d4" filter="url(#glow)"/>

  <!-- Left Headphone Ear-cup -->
  <rect x="14" y="44" width="12" height="34" rx="6" fill="#1e222a" stroke="#2e3440" stroke-width="1.5"/>
  <rect x="17" y="49" width="4" height="24" rx="2" fill="#00f5d4" filter="url(#glow)"/>

  <!-- Right Headphone Ear-cup -->
  <rect x="102" y="44" width="12" height="34" rx="6" fill="#1e222a" stroke="#2e3440" stroke-width="1.5"/>
  <rect x="107" y="49" width="4" height="24" rx="2" fill="#00f5d4" filter="url(#glow)"/>

  <!-- Main Monitor Body (Squircle) -->
  <rect x="24" y="24" width="80" height="74" rx="22" fill="url(#bodyDark)" stroke="#4a5160" stroke-width="1.5"/>
  <rect x="25" y="25" width="78" height="35" rx="20" fill="white" opacity="0.06"/>

  <!-- Screen Bezel -->
  <rect x="30" y="30" width="68" height="62" rx="16" fill="url(#bezelDark)" stroke="#1a1c22" stroke-width="1.5"/>

  <!-- Inner Curved CRT Screen -->
  <rect x="33" y="33" width="62" height="56" rx="13" fill="url(#screenGlass)"/>

  <!-- Top Glass Curved Reflection -->
  <path d="M 36 36 Q 64 45, 92 36 Q 84 48, 36 48 Z" fill="white" opacity="0.12"/>

  <!-- Cute Glowing Eyes (Happy Arches) -->
  <path d="M 44 58 C 44 50, 56 50, 56 58" fill="none" stroke="#00f5d4" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 72 58 C 72 50, 84 50, 84 58" fill="none" stroke="#00f5d4" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Cute Digital Smile -->
  <path d="M 59 69 Q 64 74, 69 69" fill="none" stroke="#00f5d4" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Little Body Feet / Base -->
  <rect x="38" y="99" width="18" height="9" rx="4.5" fill="#1a1d24" stroke="#2e3440" stroke-width="1"/>
  <rect x="72" y="99" width="18" height="9" rx="4.5" fill="#1a1d24" stroke="#2e3440" stroke-width="1"/>

  <!-- Small EFI Chest Branding -->
  <text x="64" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="900" fill="#4e5666" text-anchor="middle" letter-spacing="1">EFI</text>
</svg>
