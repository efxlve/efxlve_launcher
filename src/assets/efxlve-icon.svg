  <path d="M 144 120 C 96 120, 60 160, 52 216 C 40 288, 72 392, 112 408 C 144 420, 184 368, 208 320 C 232 288, 280 288, 304 320 C 328 368, 368 420, 400 408 C 440 392, 472 288, 460 216 C 452 160, 416 120, 368 120 C 320 120, 288 144, 256 144 C 224 144, 192 120, 144 120 Z" 
