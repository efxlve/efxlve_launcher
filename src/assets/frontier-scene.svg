<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Cinematic Frontier Sunset Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#130a17"/>
      <stop offset="22%" stop-color="#2a0f1e"/>
      <stop offset="42%" stop-color="#541421"/>
      <stop offset="60%" stop-color="#872220"/>
      <stop offset="76%" stop-color="#c4461c"/>
      <stop offset="88%" stop-color="#f08819"/>
      <stop offset="96%" stop-color="#f5af24"/>
      <stop offset="100%" stop-color="#fde074"/>
    </linearGradient>

    <!-- Warm Horizon Sun Bloom -->
    <radialGradient id="sunBloom" cx="48%" cy="72%" r="42%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.95"/>
      <stop offset="15%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#991b1b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#130a17" stop-opacity="0"/>
    </radialGradient>

    <!-- Canyon Valley Mist & Dust Haze -->
    <linearGradient id="valleyMist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#3b0f15" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#120608" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Winding Canyon River Sunset Reflection -->
    <linearGradient id="riverShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Cloud Illumination -->
    <linearGradient id="cloudGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ea580c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2a0f1e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ==================== SKY & RADIANCE ==================== -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>
  <rect width="1920" height="1080" fill="url(#sunBloom)"/>

  <!-- Low Mountain Sunset Sun -->
  <circle cx="920" cy="710" r="48" fill="#fffbeb" opacity="0.95"/>
  <circle cx="920" cy="710" r="95" fill="#fef08a" opacity="0.35"/>

  <!-- Painterly Evening Cloud Shelves -->
  <g id="sunsetClouds" opacity="0.55">
    <path d="M-60,260 C240,245 560,280 920,260 C1300,240 1640,270 2000,250 L2000,315 C1680,335 1320,310 960,325 C580,340 220,315 -60,325 Z" fill="#2d1220"/>
    <path d="M-60,315 C260,300 680,325 1060,310 C1460,295 1780,325 2000,310" stroke="url(#cloudGrad)" stroke-width="3" fill="none"/>

    <path d="M-80,430 C180,410 480,445 840,425 C1220,405 1580,435 2020,415 L2020,485 C1720,505 1360,480 1020,495 C660,510 280,485 -80,495 Z" fill="#4a151e" opacity="0.7"/>
    <path d="M-80,485 C240,465 680,495 1080,475 C1480,455 1820,485 2020,470" stroke="#fba042" stroke-width="2.5" fill="none" opacity="0.6"/>

    <path d="M120,595 C460,575 840,605 1260,585 C1620,570 1880,595 2040,580 L2040,620 C1820,635 1520,615 1200,628 C820,640 440,620 120,625 Z" fill="#7c1d22" opacity="0.5"/>
  </g>

  <!-- Soaring Wild Geese / Eagles in High Sky -->
  <g fill="#1a080f" opacity="0.8">
    <path d="M780,330 Q792,320 806,328 Q820,320 832,330 Q818,324 806,334 Q794,324 780,330 Z"/>
    <path d="M840,305 Q850,296 862,303 Q874,296 884,305 Q872,300 862,308 Q852,300 840,305 Z" transform="scale(0.85) translate(140, 40)"/>
    <path d="M730,355 Q739,348 750,353 Q761,348 770,355 Q760,351 750,359 Q740,351 730,355 Z" transform="scale(0.78) translate(210, 80)"/>
    <path d="M885,285 Q894,278 903,283 Q912,278 920,285 Q911,281 903,288 Q895,281 885,285 Z" transform="scale(0.7) translate(390, 85)"/>
  </g>

  <!-- ==================== LAYER 1: FAR GRIZZLIES MOUNTAIN CRESTS ==================== -->
  <g id="distantGrizzlies" opacity="0.85">
    <!-- Majestic Jagged Peaks Shrouded in Wine-Red Dusk -->
    <path d="M-50,710 L40,685 L120,695 L220,660 L320,675 L440,640 L560,665 L680,630 L800,655 L910,615 L1020,645 L1140,605 L1260,635 L1380,595 L1500,625 L1620,580 L1740,615 L1860,575 L1980,605 L1980,820 L-50,820 Z" fill="#2d0f19"/>
    <!-- Distant Rimline Sunset Shimmer -->
    <path d="M-50,710 L40,685 L120,695 L220,660 L320,675 L440,640 L560,665 L680,630 L800,655 L910,615 L1020,645 L1140,605 L1260,635 L1380,595 L1500,625 L1620,580 L1740,615 L1860,575 L1980,605" stroke="#dc4d22" stroke-width="1.8" fill="none" opacity="0.65"/>
  </g>

  <!-- ==================== LAYER 2: MID-RANGE CANYON BLUFFS & FOREST RIDGES ==================== -->
  <g id="midRangeRidges">
    <!-- Natural Layered Canyon Plateau (Organic Rock Formations) -->
    <!-- Left Canyon Massif -->
    <path d="M-50,770 C80,745 220,730 380,735 C520,740 640,760 780,750 C860,745 920,755 980,775 L980,890 L-50,890 Z" fill="#220b12"/>
    <!-- Natural Stepped Strata Bands on Left Massif -->
    <path d="M-50,770 C80,745 220,730 380,735 C520,740 640,760 780,750" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M60,760 C180,748 320,746 460,755" stroke="#f97316" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- Right Canyon Massif with Eroded Saddle Gap -->
    <path d="M1060,775 C1180,750 1340,735 1520,740 C1680,745 1840,725 2000,740 L2000,890 L1060,890 Z" fill="#1e0910"/>
    <path d="M1060,775 C1180,750 1340,735 1520,740 C1680,745 1840,725 2000,740" stroke="#f59e0b" stroke-width="1.8" fill="none" opacity="0.75"/>
    <path d="M1200,762 C1340,752 1480,754 1640,748" stroke="#f97316" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- Distant Pine Tree Crowns along the Canyon Ridge Crest -->
    <g fill="#16060c">
      <!-- Left Ridge Pines -->
      <polygon points="120,745 125,720 130,745"/>
      <polygon points="135,744 140,715 145,744"/>
      <polygon points="152,743 158,710 164,743"/>
      <polygon points="175,740 180,718 185,740"/>
      <polygon points="210,735 216,705 222,735"/>
      <polygon points="245,733 250,712 255,733"/>
      <polygon points="280,734 286,708 292,734"/>
      <polygon points="340,736 346,715 352,736"/>
      <polygon points="410,742 416,722 422,742"/>
      <polygon points="480,746 485,728 490,746"/>

      <!-- Right Ridge Pines -->
      <polygon points="1120,768 1125,742 1130,768"/>
      <polygon points="1155,762 1161,735 1167,762"/>
      <polygon points="1220,752 1226,725 1232,752"/>
      <polygon points="1265,748 1271,722 1277,748"/>
      <polygon points="1340,744 1346,718 1352,744"/>
      <polygon points="1420,742 1427,712 1434,742"/>
      <polygon points="1510,742 1516,720 1522,742"/>
      <polygon points="1600,743 1606,715 1612,743"/>
      <polygon points="1720,738 1726,710 1732,738"/>
      <polygon points="1810,732 1817,705 1824,732"/>
    </g>
  </g>

  <!-- ==================== LAYER 3: CANYON VALLEY FLOOR & WINDING RIVER ==================== -->
  <g id="canyonValleyAndRiver">
    <!-- Canyon Valley Floor -->
    <path d="M-50,840 C280,815 620,830 960,820 C1300,810 1640,825 2000,815 L2000,940 L-50,940 Z" fill="#170609"/>

    <!-- Winding Canyon River (Big Valley / Dakota River Shimmering in Sunset) -->
    <!-- The river snakes gracefully through the canyon gap, reflecting the molten sunset gold -->
    <path d="M780,832 C840,828 890,836 940,831 C1000,826 1060,834 1140,828 C1220,822 1290,832 1380,825 L1395,836 C1300,843 1220,832 1140,839 C1060,845 990,837 930,842 C880,847 830,838 775,843 Z" fill="url(#riverShimmer)"/>
    <!-- Intense River Specular Highlights -->
    <path d="M820,834 C870,831 920,838 970,833 C1030,828 1090,836 1170,830" stroke="#fffbeb" stroke-width="1.8" fill="none" opacity="0.9"/>
    <path d="M1010,831 C1070,828 1140,834 1220,827" stroke="#fef08a" stroke-width="2.5" fill="none" opacity="0.8"/>
  </g>

  <!-- Atmospheric Canyon Dust & Mist Layer -->
  <rect x="0" y="720" width="1920" height="180" fill="url(#valleyMist)" pointer-events="none"/>

  <!-- ==================== LAYER 4: ROLLING PINE HILLS & HISTORIC CABIN GLOW ==================== -->
  <g id="rollingPineRidge">
    <!-- Midground Hill Contour (Ground y=850 to 880) -->
    <path d="M-50,885 C220,855 480,875 780,855 C1080,838 1380,860 1680,845 C1860,838 1940,845 2000,842 L2000,980 L-50,980 Z" fill="#120407"/>
    <!-- Hill Crest Rimlight -->
    <path d="M-50,885 C220,855 480,875 780,855 C1080,838 1380,860 1680,845 C1860,838 1940,845 2000,842" stroke="#ea580c" stroke-width="1.6" fill="none" opacity="0.5"/>

    <!-- Clustered Forest Pines along the Hill (Left-Center) -->
    <g fill="#0c0205">
      <!-- Cluster 1 (x=380-450) -->
      <polygon points="380,868 387,830 394,868"/>
      <polygon points="392,866 400,820 408,866"/>
      <polygon points="405,865 414,810 423,865"/>
      <polygon points="420,866 428,825 436,866"/>
      <polygon points="432,867 439,835 446,867"/>

      <!-- Cluster 2 (x=680-750) -->
      <polygon points="685,860 692,828 699,860"/>
      <polygon points="696,858 704,815 712,858"/>
      <polygon points="709,856 718,802 727,856"/>
      <polygon points="724,858 732,820 740,858"/>

      <!-- Cluster 3 (x=980-1040) -->
      <polygon points="985,846 991,818 997,846"/>
      <polygon points="995,844 1002,805 1009,844"/>
      <polygon points="1006,845 1013,812 1020,845"/>
    </g>

    <!-- Distant Rustic Homestead / Cabin with Warm Window Light (x=540, Ground y=862) -->
    <g id="distantCabin">
      <!-- Timber Log Cabin Silhouette -->
      <polygon points="530,864 530,848 546,838 562,848 562,864" fill="#090204"/>
      <!-- Chimney with faint wood smoke plume -->
      <rect x="553" y="834" width="4" height="10" fill="#090204"/>
      <path d="M555,834 C553,822 559,812 556,800 C553,790 558,780 554,770" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.35"/>
      <!-- Cozy Warm Cabin Window Glow (Hearth fire inside) -->
      <rect x="538" y="852" width="6" height="6" rx="0.5" fill="#fef08a"/>
      <circle cx="541" cy="855" r="14" fill="#f59e0b" opacity="0.35"/>
      <!-- Small Split-Rail Fence Beside Cabin -->
      <g stroke="#090204" stroke-width="1.5">
        <line x1="518" y1="865" x2="518" y2="856"/>
        <line x1="528" y1="865" x2="528" y2="856"/>
        <line x1="515" y1="859" x2="530" y2="859"/>
        <line x1="516" y1="863" x2="529" y2="863"/>
      </g>
    </g>
  </g>

  <!-- ==================== LAYER 5: GRAND FOREGROUND CANYON OVERLOOK BLUFF ==================== -->
  <!-- Solid, grounded, craggy rock ledge sweeping across the bottom of the screen -->
  <g id="foregroundOverlook">
    <!-- Massive Sandstone Shelf (Ground level y=880 to 920 across the bottom) -->
    <path d="M-50,910 C180,885 420,910 680,890 C940,875 1200,905 1460,880 C1660,860 1840,880 2000,870 L2000,1080 L-50,1080 Z" fill="#0a0204"/>
    <!-- Granite Ledge Sunset Rimlight -->
    <path d="M-50,910 C180,885 420,910 680,890 C940,875 1200,905 1460,880 C1660,860 1840,880 2000,870" stroke="#f97316" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Organic Rock Strata Cracks & Boulder Fissures on the Cliff -->
    <g stroke="#040102" stroke-width="3.5" fill="none" opacity="0.85">
      <path d="M80,935 L180,960 L320,945 L480,980"/>
      <path d="M680,915 L820,945 L980,930 L1160,960"/>
      <path d="M1360,905 L1520,935 L1720,915"/>
    </g>

    <!-- Left Foreground: Alpine Pines & Mountain Flora (Anchored firmly into rock soil) -->
    <g id="leftForegroundPines" fill="#070103">
      <!-- Ponderosa Pine 1 (Tall, majestic, rooted at x=140, ground y=905) -->
      <g>
        <!-- Trunk rooted firmly into rock crevice -->
        <path d="M136,910 L136,760 C136,750 144,750 144,760 L144,910 Z"/>
        <!-- Layered Pine Boughs (Hand-crafted asymmetrical pine branches) -->
        <polygon points="140,735 120,770 160,770"/>
        <polygon points="140,755 110,795 170,795"/>
        <polygon points="140,775 100,825 180,825"/>
        <polygon points="140,805 92,860 188,860"/>
        <polygon points="140,835 85,895 195,895"/>
        <!-- Sunset Rimlight on Pine Tips -->
        <path d="M160,770 L140,735" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>
        <path d="M170,795 L140,755" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>
        <path d="M180,825 L140,775" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>
        <path d="M188,860 L140,805" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>
      </g>

      <!-- Smaller Companion Pine (Rooted at x=210, ground y=908) -->
      <g>
        <path d="M208,910 L208,810 C208,802 214,802 214,810 L214,910 Z"/>
        <polygon points="211,795 195,825 227,825"/>
        <polygon points="211,815 188,850 234,850"/>
        <polygon points="211,838 180,880 242,880"/>
      </g>

      <!-- Natural Mountain Prairie Grass & Wild Sagebrush Tufts along the Edge -->
      <path d="M90,912 Q98,892 108,910 Q104,895 115,911 Q100,900 90,912 Z"/>
      <path d="M170,910 Q178,890 188,908 Q184,894 195,909 Z"/>
      <path d="M250,911 Q258,894 266,910 Q262,896 272,911 Z"/>
      <path d="M340,908 Q349,888 358,906 Q354,892 366,908 Z"/>
    </g>

    <!-- ==================== RIGHT PROMONTORY: MAJESTIC MOUNTAIN STAG OVERLOOK ==================== -->
    <!-- The iconic, noble buck/stag with antlers standing proudly atop the sandstone promontory -->
    <!-- Arthur Morgan's high-honor spiritual guardian gazing west into the glowing sunset valley -->
    <!-- Promontory rock base at x=1680, ground level y=870 -->
    <g id="nobleStagOverlook" fill="#060102">
      <!-- Outcrop Granite Boulder Pedestal directly beneath hooves -->
      <polygon points="1560,885 1610,870 1780,870 1840,892 1810,915 1580,915" fill="#090204"/>
      <path d="M1610,870 L1780,870" stroke="#f59e0b" stroke-width="1.8" opacity="0.7"/>

      <!-- ANATOMICAL STAG SILHOUETTE (Standing Proud & Alert on the Cliff Edge) -->
      <!-- Back Left Leg & Hoof firmly on rock (ground y=870) -->
      <path d="M1648,820 L1644,845 L1640,870 L1646,870 L1650,845 L1656,820 Z"/>
      <!-- Back Right Leg & Hoof -->
      <path d="M1658,820 L1660,845 L1663,870 L1668,870 L1666,845 L1664,820 Z"/>
      <!-- Front Left Leg & Hoof firmly on rock (ground y=870) -->
      <path d="M1708,820 L1710,845 L1712,870 L1718,870 L1716,845 L1714,820 Z"/>
      <!-- Front Right Leg (Poised proudly forward on rock edge) -->
      <path d="M1718,820 L1724,845 L1728,870 L1734,870 L1730,845 L1724,820 Z"/>

      <!-- Muscular Torso, Ribcage & Flank -->
      <path d="M1640,810 C1635,785 1655,775 1680,775 C1705,775 1722,785 1718,810 C1712,826 1695,832 1680,830 C1655,830 1642,824 1640,810 Z"/>
      <!-- Small tail -->
      <path d="M1640,795 C1632,802 1634,812 1638,818 Z"/>

      <!-- Powerful High-Arched Neck rising into the golden glow -->
      <path d="M1710,790 C1716,770 1722,748 1726,730 C1730,724 1738,726 1735,736 C1732,748 1725,765 1722,780 C1718,795 1715,802 1710,808 Z"/>
      <!-- Stag Head, Alert Muzzle & Ears (Facing West toward the setting sun) -->
      <path d="M1726,732 C1724,726 1728,720 1738,722 L1746,725 C1750,727 1748,732 1742,735 L1732,737 Z"/>
      <!-- Ears in alert backward posture -->
      <path d="M1727,725 Q1720,714 1726,708 Q1730,715 1728,723 Z"/>

      <!-- MAGNIFICENT ANTLERS (Spread out majestically against the sunset amber sky) -->
      <!-- Left Antler Beam & Tines (Brow, Bez, Trez & Crown tines) -->
      <path d="M1729,720 C1726,705 1718,690 1708,675 C1705,670 1708,668 1711,672 C1718,682 1725,695 1730,712 Z"/>
      <!-- Left Brow Tine (forward pointing) -->
      <path d="M1728,710 Q1718,705 1712,708 Q1718,711 1727,713 Z"/>
      <!-- Left Trez Tine (branching upper-left) -->
      <path d="M1720,690 Q1705,682 1698,685 Q1707,688 1718,692 Z"/>
      <!-- Left Crown Fork (forked tips) -->
      <path d="M1710,678 Q1695,668 1690,672 Q1698,674 1708,680 Z"/>
      <path d="M1708,675 Q1702,660 1705,658 Q1708,665 1710,672 Z"/>

      <!-- Right Antler Beam & Tines (Towering tall into the sky) -->
      <path d="M1732,720 C1734,702 1740,685 1750,668 C1753,663 1756,666 1753,671 C1745,684 1738,700 1734,714 Z"/>
      <!-- Right Brow Tine -->
      <path d="M1733,708 Q1742,702 1748,705 Q1742,709 1734,711 Z"/>
      <!-- Right Trez Tine -->
      <path d="M1738,688 Q1752,680 1758,683 Q1750,687 1740,691 Z"/>
      <!-- Right Crown Fork -->
      <path d="M1748,672 Q1762,662 1768,665 Q1758,668 1750,674 Z"/>
      <path d="M1750,668 Q1755,652 1752,650 Q1750,658 1748,666 Z"/>

      <!-- Sunset Golden Rimlight on Stag & Antlers (Catching the brilliant sunset sun) -->
      <path d="M1746,725 L1738,722 C1728,720 1724,726 1726,732" stroke="#fef08a" stroke-width="1.8" fill="none" opacity="0.9"/>
      <path d="M1753,671 C1745,684 1738,700 1734,714" stroke="#fef08a" stroke-width="1.4" fill="none" opacity="0.85"/>
      <path d="M1750,668 Q1762,662 1768,665" stroke="#fef08a" stroke-width="1.2" fill="none" opacity="0.8"/>
      <path d="M1726,730 C1730,724 1738,726 1735,736 C1732,748 1725,765 1722,780" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.8"/>
      <path d="M1718,810 C1712,826 1695,832 1680,830" stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.6"/>
      <path d="M1728,870 L1734,870" stroke="#fef08a" stroke-width="1.5" fill="none" opacity="0.8"/>
    </g>

    <!-- Mountain Cliff Framing Pine on the Far Right Edge (Rooted at x=1860, y=870) -->
    <g id="rightFramingPine" fill="#060102">
      <path d="M1855,875 L1855,640 C1855,630 1865,630 1865,640 L1865,875 Z"/>
      <!-- Spreading alpine pine branches sweeping gracefully into frame -->
      <polygon points="1860,620 1835,660 1885,660"/>
      <polygon points="1860,645 1820,695 1900,695"/>
      <polygon points="1860,675 1805,735 1915,735"/>
      <polygon points="1860,710 1790,780 1930,780"/>
      <polygon points="1860,750 1775,830 1945,830"/>
      <!-- Rimlight on branches -->
      <path d="M1835,660 L1860,620" stroke="#f59e0b" stroke-width="1.4" opacity="0.65"/>
      <path d="M1820,695 L1860,645" stroke="#f59e0b" stroke-width="1.4" opacity="0.65"/>
      <path d="M1805,735 L1860,675" stroke="#f59e0b" stroke-width="1.4" opacity="0.65"/>
      <path d="M1790,780 L1860,710" stroke="#f59e0b" stroke-width="1.4" opacity="0.65"/>
    </g>
  </g>

  <!-- Vintage Western Filigree Corner Accents -->
  <g stroke="rgba(245, 158, 11, 0.22)" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M1880,40 Q1850,40 1850,70"/>
    <path d="M1890,30 Q1840,30 1840,80"/>
    <circle cx="1850" cy="70" r="2" fill="#f59e0b"/>
    <path d="M40,1040 Q70,1040 70,1010"/>
    <path d="M30,1050 Q80,1050 80,1000"/>
    <circle cx="70" cy="1010" r="2" fill="#f59e0b"/>
  </g>
</svg>
