[package]
name = "efxlve-launcher"
version = "0.1.32"
license = "GPL-3.0-only"
description = "Efxlve oyun mağazası launcher (Tauri v2 demo)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
url = "2"
base64 = "0.22"
discord-rich-presence = "1.1"
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
tar = "0.4"
xz2 = "0.1"
zstd = "0.13"
sha2 = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rsa = "0.9"
zeroize = "1"
rand = "0.8"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
notify = "6"
sysinfo = "0.33"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
hidapi = "2"
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
librespot = "0.8"
rodio = "0.21"
protobuf = "3"
crc32fast = "1"
ferrisetw = "1.2"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Foundation", "Media_Control", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Diagnostics_Etw", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
