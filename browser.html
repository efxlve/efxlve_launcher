<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Efxlve Browser</title>
  </head>
  <body class="ov-browser-page">
    <div class="ov-browser-topbar" id="ov-browser-topbar" data-tauri-drag-region>
      <div class="ov-browser-tabs-wrapper" id="ov-browser-tabs-wrapper" data-tauri-drag-region>
        <div class="ov-browser-tabs" id="ov-browser-tabs"></div>
      </div>
      <div class="ov-browser-drag-filler" data-tauri-drag-region></div>
      <div class="ov-browser-window-controls" id="ov-browser-window-controls">
        <button class="ov-browser-ctrl-btn" data-pip="toggle" title="Picture in picture" aria-label="Picture in picture">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><rect x="12" y="12" width="6" height="4" rx="1"></rect></svg>
        </button>
        <button class="ov-browser-ctrl-btn ov-browser-ctrl-close" data-win="close" title="Kapat" aria-label="Close">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>
    <div class="ov-browser-pipbar" id="ov-browser-pipbar" data-tauri-drag-region>
      <span class="ov-browser-pip-title" id="ov-browser-pip-title" data-tauri-drag-region></span>
      <button class="ov-browser-pip-btn" data-pip="click-through" title="Click-through (Ctrl+Shift+P to turn off)" aria-label="Click-through">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9l6 6"></path><path d="M15 9l-6 6"></path><circle cx="12" cy="12" r="9"></circle></svg>
      </button>
      <button class="ov-browser-pip-btn" data-pip="corner" title="Move to the next corner" aria-label="Move to the next corner">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 3 3 3 3 9"></polyline><polyline points="15 21 21 21 21 15"></polyline><line x1="3" y1="3" x2="10" y2="10"></line><line x1="21" y1="21" x2="14" y2="14"></line></svg>
      </button>
      <button class="ov-browser-pip-btn" data-pip="restore" title="Exit picture in picture" aria-label="Exit picture in picture">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
      </button>
      <button class="ov-browser-pip-btn" data-pip="close" title="Kapat" aria-label="Close">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <header class="ov-browser-chrome" id="ov-browser-chrome" data-tauri-drag-region></header>
    <div class="ov-browser-bookmarks" id="ov-browser-bookmarks"></div>
    <div class="ov-browser-frame" id="ov-browser-frame"></div>
    <script type="module" src="/src/features/overlay/browser-window.ts"></script>
  </body>
</html>
