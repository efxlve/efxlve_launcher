<!doctype html>
<html lang="tr" style="background-color: #07080d; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07080d" />
    <title>Efxlve Launcher</title>
    <style>
      /* Anti-FOUC: CSS yüklenmeden önceki ilk karede saf obsidyen çizilir. */
      html, body { margin: 0; background-color: #07080d; color-scheme: dark; }
    </style>
  </head>
  <body style="background-color: #07080d;">
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <span class="nav-underline" id="nav-indicator" aria-hidden="true"></span>
        <div class="logo" data-act="goto-library" data-tauri-drag-region>
          <span class="logo-mark"><i data-lucide="gamepad-2"></i></span>
          <span class="logo-text">EFXLVE</span>
        </div>
        <nav id="nav">
          <div class="nav-seg" id="nav-seg">
            <button class="nav-tab" data-act="open-store" title="Epic Mağazası — Gömülü Mağaza (Ctrl+1)"><i data-lucide="store"></i><span data-i18n="nav.store">Mağaza</span></button>
            <button class="nav-tab active" data-view="library" title="Kütüphane (Ctrl+2)"><i data-lucide="layout-grid"></i><span data-i18n="nav.library">Kütüphane</span></button>
            <button class="nav-tab" data-view="downloads" title="İndirmeler & Kuyruk (Ctrl+3)"><i data-lucide="download"></i><span data-i18n="nav.downloads">İndirmeler</span><span id="dl-badge" class="badge hidden"></span></button>
          </div>
          <div class="nav-right">
            <button id="btn-offline-mode" class="net-chip online" data-act="toggle-offline-mode" title="Çevrimiçi Mod Aktif (Çevrimdışı moda geçmek için tıklayın)">
              <span class="net-dot"></span><span class="net-label" data-i18n="nav.online">Çevrimiçi</span>
            </button>
            <button id="account" class="account-chip" data-view="profile" title="Epic profili">
              <span class="account-avatar"><i data-lucide="circle-user-round"></i></span>
              <span class="account-name" data-i18n="nav.notLoggedIn">Giriş yapılmadı</span>
            </button>
            <button class="nav-icon-btn" data-view="settings" title="Ayarlar (Ctrl+,)"><i data-lucide="settings"></i></button>
          </div>
        </nav>
        <div class="win-controls">
          <button class="win-btn" data-act="win-minimize" title="Simge Durumuna Küçült">
            <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
          </button>
          <button class="win-btn" data-act="win-maximize" title="Ekranı Kapla">
            <svg id="win-max-icon" width="10" height="10" viewBox="0 0 10 10"><rect width="9" height="9" x="0.5" y="0.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="win-btn win-close" data-act="win-close" title="Kapat">
            <svg width="10" height="10" viewBox="0 0 10 10"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M1 1l8 8M9 1L1 9"/></svg>
          </button>
        </div>
      </header>
      <main id="content">
        <section id="view"></section>
      </main>
    </div>
  <div id="modal-root"></div>
  <div id="selective-root"></div>
    <div id="playtime-root"></div>
    <div id="collection-root"></div>
    <div id="cover-modal-root"></div>
    <div id="share-modal-root"></div>
    <div id="move-modal-root"></div>
    <div id="ctx-root"></div>
    <div id="toasts"></div>
    <button id="totop" data-act="to-top" title="Başa dön">↑</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
