<!doctype html>
<html lang="tr" style="background-color: #07080d; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07080d" />
    <title>Efxlve Launcher</title>
    <style>
      /* Anti-FOUC: paint pure obsidian on the first frame before the CSS loads. */
      html, body { margin: 0; background-color: #07080d; color-scheme: dark; }
    </style>
  </head>
  <body style="background-color: #07080d;">
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <span class="nav-underline" id="nav-indicator" aria-hidden="true"></span>
        <div class="logo" data-act="goto-library" data-tauri-drag-region>
          <span class="logo-mark"><i data-lucide="gamepad-2"></i></span>
          <span class="logo-text">EFXLVE</span>
        </div>
        <nav id="nav">
          <div class="nav-seg" id="nav-seg">
            <button class="nav-tab" data-act="open-store" data-i18n-title="nav.storeTitle" title="Epic Games Store (Ctrl+1)"><i data-lucide="store"></i><span data-i18n="nav.store">Store</span></button>
            <button class="nav-tab active" data-view="library" data-i18n-title="nav.libraryTitle" title="Library (Ctrl+2)"><i data-lucide="layout-grid"></i><span data-i18n="nav.library">Library</span></button>
            <button class="nav-tab" data-view="downloads" data-i18n-title="nav.downloadsTitle" title="Downloads &amp; Queue (Ctrl+3)"><i data-lucide="download"></i><span data-i18n="nav.downloads">Downloads</span><span id="dl-badge" class="badge hidden"></span></button>
          </div>
          <div class="nav-right">
            <button id="notif-btn" class="nav-icon-btn notif-btn" data-act="toggle-notifications" data-i18n-title="notif.title" title="Notifications">
              <i data-lucide="bell"></i>
              <span id="notif-badge" class="badge notif-badge hidden"></span>
            </button>
            <button id="btn-offline-mode" class="net-chip online" data-act="toggle-offline-mode" data-i18n-title="nav.onlineTip" title="Online Mode Active">
              <span class="net-dot"></span><span class="net-label" data-i18n="nav.online">Çevrimiçi</span>
            </button>
            <button id="account" class="account-chip" data-view="profile" data-i18n-title="nav.profileTitle" title="Epic profile">
              <span class="account-avatar"><i data-lucide="circle-user-round"></i></span>
              <span class="account-name" data-i18n="nav.notLoggedIn">Giriş yapılmadı</span>
            </button>
            <button class="nav-icon-btn" data-view="settings" data-i18n-title="nav.settingsTitle" title="Settings (Ctrl+,)"><i data-lucide="settings"></i></button>
          </div>
        </nav>
        <div class="win-controls">
          <button class="win-btn" data-act="win-minimize" data-i18n-title="win.minimize" title="Minimize">
            <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
          </button>
          <button class="win-btn" data-act="win-maximize" data-i18n-title="win.maximize" title="Maximize">
            <svg id="win-max-icon" width="10" height="10" viewBox="0 0 10 10"><rect width="9" height="9" x="0.5" y="0.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="win-btn win-close" data-act="win-close" data-i18n-title="common.close" title="Close">
            <svg width="10" height="10" viewBox="0 0 10 10"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M1 1l8 8M9 1L1 9"/></svg>
          </button>
        </div>
      </header>
      <main id="content">
        <section id="view">
          <!-- Inline-styled boot splash: paints instantly, before the JS bundle and
               the CSS bundle load. render() replaces it with the real view. -->
          <div id="boot-splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;gap:16px;">
            <span style="width:46px;height:46px;border-radius:13px;background:rgba(139,92,246,0.14);display:flex;align-items:center;justify-content:center;">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg>
            </span>
            <span style="font-size:11px;letter-spacing:0.22em;font-weight:700;color:#565b6b;">EFXLVE</span>
          </div>
        </section>
      </main>
    </div>
  <div id="modal-root"></div>
  <div id="selective-root"></div>
    <div id="playtime-root"></div>
    <div id="collection-root"></div>
    <div id="cover-modal-root"></div>
    <div id="share-modal-root"></div>
    <div id="move-modal-root"></div>
    <div id="storage-root"></div>
  <div id="ctx-root"></div>
  <div id="notif-root"></div>
    <div id="toasts"></div>
    <button id="totop" data-act="to-top" data-i18n-title="common.toTop" title="Back to top">↑</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
