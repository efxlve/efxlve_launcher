<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Efxlve Launcher</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <div class="logo" data-act="goto-library" data-tauri-drag-region><i data-lucide="gamepad-2"></i><span>EFXLVE</span></div>
        <nav id="nav">
          <button data-act="open-store"><i data-lucide="store"></i><span>Mağaza</span></button>
          <button data-view="library" class="active"><i data-lucide="layout-grid"></i><span>Kütüphane</span></button>
          <button data-view="downloads"><i data-lucide="download"></i><span>İndirmeler</span><span id="dl-badge" class="badge hidden"></span></button>
          <button id="account" class="profile" data-view="profile" title="Epic profili"><i data-lucide="circle-user-round"></i><span>Giriş yapılmadı</span></button>
          <button id="btn-social-drawer" class="social-nav-btn" data-act="toggle-social" title="EOS Sosyal & Arkadaşlar (Shift+F3)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Sosyal</span><span id="social-online-badge" class="badge-count hidden">0</span></button>
          <button id="btn-offline-mode" class="offline-toggle-btn" data-act="toggle-offline-mode" title="Çevrimdışı Modu Aç/Kapat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg><span>Çevrimiçi</span></button>
          <button data-view="settings" class="right" title="Ayarlar"><i data-lucide="settings"></i></button>
        </nav>
        <div class="win-controls">
          <button class="win-btn" data-act="win-minimize" title="Simge Durumuna Küçült">
            <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
          </button>
          <button class="win-btn" data-act="win-maximize" title="Ekranı Kapla">
            <svg id="win-max-icon" width="10" height="10" viewBox="0 0 10 10"><rect width="9" height="9" x="0.5" y="0.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="win-btn win-close" data-act="win-close" title="Kapat">
            <svg width="10" height="10" viewBox="0 0 10 10"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M1 1l8 8M9 1L1 9"/></svg>
          </button>
        </div>
      </header>
      <main id="content">
        <section id="view"></section>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="manage-root"></div>
    <div id="selective-root"></div>
    <div id="playtime-root"></div>
    <div id="collection-root"></div>
    <div id="cover-modal-root"></div>
    <div id="share-modal-root"></div>
    <div id="move-modal-root"></div>
    <div id="social-root"></div>
    <div id="toasts"></div>
    <button id="totop" data-act="to-top" title="Başa dön">↑</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
