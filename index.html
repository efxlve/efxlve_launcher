<!doctype html>
<html lang="tr" style="background-color: #000000; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Efxlve Launcher</title>
    <style>
      /* Hold the shell until the stylesheet is applied. Otherwise the first frame is raw browser buttons. */
      html, body { margin: 0; height: 100%; background-color: #000000; color-scheme: dark; overflow: hidden; }
      html:not(.ready) body > * { visibility: hidden; }
    </style>
    <script>
      (function () {
        document.documentElement.classList.add("sb-no-anim");
        try {
          var w = parseInt(localStorage.getItem("efxlve-sidebar-w") || "", 10);
          if (w >= 72 && w <= 400) {
            document.documentElement.style.setProperty("--sidebar-w", w + "px");
            if (w < 160) document.documentElement.classList.add("sb-narrow");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background-color: #000000;">
    <div id="app">
      <header id="winbar" data-tauri-drag-region>
        <span class="winbar-title" data-tauri-drag-region>Efxlve Launcher</span>
        <button type="button" class="winbar-version-pill" data-act="open-changelog" title="Changelog">
          <span class="winbar-beta-chip">BETA</span>
          <span id="winbar-version-num" class="winbar-version-num">v0.1.20</span>
        </button>
        <div class="winbar-spacer" data-tauri-drag-region></div>
        <button id="btn-offline-mode" class="winbar-btn net-chip online" data-act="toggle-offline-mode" data-i18n-title="nav.onlineTip" title="Online">
          <span class="net-dot"></span><span class="net-label" data-i18n="nav.online">Online</span>
        </button>
        <button type="button" id="btn-tv-mode" class="winbar-btn" data-act="open-tv-mode" data-i18n-title="tv.open" title="TV Mode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="20" height="12" x="2" y="6" rx="2"/>
            <line x1="6" x2="10" y1="12" y2="12"/>
            <line x1="8" x2="8" y1="10" y2="14"/>
            <line x1="15" x2="15.01" y1="13" y2="13"/>
            <line x1="18" x2="18.01" y1="11" y2="11"/>
          </svg>
          <span data-i18n="tv.mode">TV Mode</span>
        </button>
        <div class="win-controls">
          <button class="win-btn" data-act="win-minimize" data-i18n-title="win.minimize" title="Minimize">
            <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
          </button>
          <button class="win-btn" data-act="win-maximize" data-i18n-title="win.maximize" title="Maximize">
            <svg id="win-max-icon" width="10" height="10" viewBox="0 0 10 10"><rect width="9" height="9" x="0.5" y="0.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="win-btn win-close" data-act="win-close" data-i18n-title="common.close" title="Close">
            <svg width="10" height="10" viewBox="0 0 10 10"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M1 1l8 8M9 1L1 9"/></svg>
          </button>
        </div>
      </header>
      <div id="body">
        <aside id="sidebar">
          <div class="sb-profile">
            <button id="account" class="sb-account" data-view="accounts" data-i18n-title="nav.accountsTitle" title="Accounts">
              <span class="account-avatar"><i data-lucide="circle-user-round"></i></span>
              <span class="account-name" data-i18n="nav.signIn">Sign in</span>
            </button>
            <button id="notif-btn" class="icon-btn sb-notif" data-act="toggle-notifications" data-i18n-title="notif.title" title="Notifications">
              <i data-lucide="bell"></i>
              <span id="notif-badge" class="notif-badge hidden"></span>
            </button>
          </div>
          <nav id="nav" class="sb-nav">
            <button class="sb-item" data-act="open-store" data-i18n-title="nav.storeTitle" title="Mağazalar (Ctrl+1)"><i data-lucide="store"></i><span data-i18n="nav.store">Mağazalar</span></button>
            <button class="sb-item active" data-view="library" data-i18n-title="nav.libraryTitle" title="Library (Ctrl+2)"><i data-lucide="layout-grid"></i><span data-i18n="nav.library">Library</span></button>
            <button class="sb-item" data-view="downloads" data-i18n-title="nav.downloadsTitle" title="Downloads (Ctrl+3)"><i data-lucide="download"></i><span data-i18n="nav.downloads">Downloads</span><span id="dl-badge" class="sb-count hidden"></span></button>
            <button class="sb-item" data-view="settings" data-i18n-title="nav.settingsTitle" title="Settings (Ctrl+,)"><i data-lucide="settings"></i><span data-i18n="nav.settings">Settings</span></button>
            <button class="sb-item" data-act="coming-soon" data-app="spotify" title="Spotify"><i data-lucide="music"></i><span>Spotify</span></button>
            <button class="sb-item" data-act="coming-soon" data-app="discord" title="Discord"><i data-lucide="message-circle"></i><span>Discord</span></button>
          </nav>
          <div id="sb-games" class="sb-games"></div>
          <button type="button" id="sb-toggle" class="sb-toggle" data-act="toggle-sidebar" aria-expanded="true" data-i18n-title="nav.collapseSidebar" title="Collapse sidebar">
            <svg class="sb-toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2"/>
              <path d="M9 4v16"/>
              <path d="m15 9-3 3 3 3"/>
            </svg>
            <span class="sb-toggle-label">Collapse</span>
          </button>
          <div id="sb-resize" class="sb-resize" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="nav.resizeSidebar" title="Resize sidebar"></div>
        </aside>
        <div id="main-col">
          <header id="page-header">
            <button class="icon-btn" data-act="page-back" id="nav-back-btn" data-i18n-title="nav.historyBack" title="Back (Alt+Left)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            </button>
            <h1 id="page-title" class="page-header-title"></h1>
            <span id="lib-heading-count" class="page-header-count" hidden></span>
            <div id="store-tabs-bar" class="store-tabs-bar" hidden>
              <button type="button" class="store-tabs-arrow" data-act="store-tabs-scroll" data-dir="-1" data-i18n-title="store.tabsPrev" title="Previous stores" aria-label="Previous stores">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <nav id="store-switcher" class="store-tabs" aria-label="Stores">
                <span class="store-tabs-underline" aria-hidden="true"></span>
                <button type="button" class="tab active" data-act="open-store" data-store="epic" aria-current="page">Epic Games</button>
                <button type="button" class="tab" data-act="open-store" data-store="gog">GOG</button>
                <button type="button" class="tab" data-act="open-store" data-store="steam">Steam</button>
                <button type="button" class="tab" data-act="open-store" data-store="xbox">Xbox</button>
                <button type="button" class="tab" data-act="open-store" data-store="battlenet">Battle.net</button>
                <button type="button" class="tab" data-act="open-store" data-store="ubisoft">Ubisoft Connect</button>
                <button type="button" class="tab" data-act="open-store" data-store="ea">EA App</button>
              </nav>
              <button type="button" class="store-tabs-arrow" data-act="store-tabs-scroll" data-dir="1" data-i18n-title="store.tabsNext" title="Next stores" aria-label="Next stores">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
            <button class="page-search" data-act="open-palette" data-i18n-title="palette.open" title="Search (Ctrl+K)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <span data-i18n="palette.searchGames">Search games</span>
              <span class="kbd">Ctrl K</span>
            </button>
            <div id="store-progress-line" class="store-progress-line hidden"></div>
          </header>
          <main id="content">
            <section id="view"></section>
          </main>
        </div>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="options-root"></div>
    <div id="selective-root"></div>
    <div id="install-root"></div>
    <div id="manage-root"></div>
    <div id="playtime-root"></div>
    <div id="collection-root"></div>
    <div id="hide-games-root"></div>
    <div id="hide-achievements-root"></div>
    <div id="cover-modal-root"></div>
    <div id="share-modal-root"></div>
    <div id="move-modal-root"></div>
    <div id="storage-root"></div>
    <div id="palette-root"></div>
    <div id="ctx-root"></div>
    <div id="notif-root"></div>
    <div id="changelog-root"></div>
    <div id="account-switch" class="account-switch" hidden>
      <span class="spinner"></span>
      <span class="account-switch-name"></span>
    </div>
    <div id="toasts"></div>
    <button id="totop" data-act="to-top" data-i18n-title="common.toTop" title="Back to top">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
