<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notifications</title>
    <!--
      Host page for the notification dropdown / changelog child webview.

      It is a real app page on purpose: an `about:blank` document is a remote
      origin for the Tauri IPC, so clicks in the dropdown were rejected before
      they could reach the shell. Rust writes the panel into this document
      (`document.open/write` keeps the URL and the injected IPC bridge), and the
      black background hides the one frame before that write lands.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000000;
        overflow: hidden;
      }
    </style>
  </head>
  <body></body>
</html>
