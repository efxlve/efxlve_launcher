# Builds and publishes Efxlve Launcher on every version tag.
#
# Flow: bump the version in `src-tauri/tauri.conf.json` (and `Cargo.toml`),
# commit, then push a matching tag (e.g. `v0.1.1`). The action builds the app,
# creates/updates the GitHub Release for that tag, uploads the installers and
# `.sig` files, and publishes `latest.json` — the static endpoint the in-app
# updater polls (`https://github.com/efxlve/efxlve_launcher/releases/latest/download/latest.json`).
#
# Required repository secrets:
# - TAURI_SIGNING_PRIVATE_KEY          (content of ~/.tauri/efxlve.key)
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty string when the key has no password)
#
# Windows is signed with the updater key. Linux and macOS artifacts are built
# unsigned for the preview; Apple notarization and Flatpak are still open.
# The manual `package.yml` workflow remains useful for a quick local installer
# check without publishing a release.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            target: ""
            linux: false
          - platform: ubuntu-22.04
            args: ""
            target: ""
            linux: true
          - platform: macos-latest
            args: ""
            target: ""
            linux: false
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Efxlve Launcher v__VERSION__"
          releaseBody: "Installers and updater packages are attached below."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Package the portable Windows build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/efxlve-launcher.exe portable/
          Set-Content -Path portable/portable.txt -Value "portable"
          @"
          Efxlve Launcher portable
          Run efxlve-launcher.exe. Launcher data stays in portable-data next to this file.
          "@ | Set-Content -Path portable/README.txt
          Compress-Archive -Path portable/* -DestinationPath efxlve-launcher-portable.zip -Force

      - name: Upload the portable Windows build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release upload "v$version" efxlve-launcher-portable.zip --clobber
