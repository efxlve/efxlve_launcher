# Builds and publishes Efxlve Launcher on every version tag.
#
# Flow: bump the version in `src-tauri/tauri.conf.json` (and `Cargo.toml`),
# commit, then push a matching tag (e.g. `v0.1.1`). The action builds the app
# into a draft release and uploads the installers and `.sig` files. A final job
# rewrites `latest.json` to stable release download URLs and publishes the draft
# only after every asset exists, so the updater never sees a release with a
# missing installer. `latest.json` is the static endpoint the in-app updater
# polls (`https://github.com/efxlve/efxlve_launcher/releases/latest/download/latest.json`).
#
# Required repository secrets:
# - TAURI_SIGNING_PRIVATE_KEY          (content of ~/.tauri/efxlve.key)
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty string when the key has no password)
#
# Windows is signed with the updater key. Linux and macOS artifacts are built
# unsigned for the preview; Apple notarization and Flatpak are still open.
# The manual `package.yml` workflow remains useful for a quick local installer
# check without publishing a release.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            target: ""
            linux: false
          - platform: ubuntu-22.04
            args: ""
            target: ""
            linux: true
          - platform: macos-latest
            args: ""
            target: ""
            linux: false
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.linux
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          # The hosted image can still be running its own apt jobs at boot.
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo pkill -9 -f unattended-upgrades 2>/dev/null || true
          # Ubuntu's own mirror DNS was failing on the hosted runner; the
          # kernel.org mirror carries the same archive over HTTPS.
          printf 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          getent hosts mirrors.edge.kernel.org || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o DPkg::Lock::Timeout=120 \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      # The bundler caches the AppImage launcher with mode 0770, so anyone who
      # is not the build user (the AppImage catalog test, or a normal player)
      # cannot execute AppRun.wrapped. Seed a world-executable copy first; the
      # bundler only downloads its own when this file is missing.
      - name: Prepare the AppImage launcher
        if: matrix.linux
        run: |
          mkdir -p "$HOME/.cache/tauri"
          curl -fsSL \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 \
            -o "$HOME/.cache/tauri/AppRun-x86_64"
          chmod 755 "$HOME/.cache/tauri/AppRun-x86_64"

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Efxlve Launcher v__VERSION__"
          releaseBody: "Installers and updater packages are attached below."
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # A failed check here leaves the release a draft: publish-release needs
      # this job, so a broken launcher is never published.
      - name: Verify the AppImage launcher permissions
        if: matrix.linux
        run: |
          set -e
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          test -n "$appimage"
          chmod +x "$appimage"
          work=$(mktemp -d)
          (cd "$work" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          # The catalog test runs as an unrelated user, so every executable
          # inside the image must also carry the "other" execute bit.
          bad=$(find "$work/squashfs-root" -type f -perm /111 ! -perm -o+x)
          if [ -n "$bad" ]; then
            echo "not executable for other users:" >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Package the portable Windows build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/efxlve-launcher.exe portable/
          Set-Content -Path portable/portable.txt -Value "portable"
          @"
          Efxlve Launcher portable
          Run efxlve-launcher.exe. Launcher data stays in portable-data next to this file.
          "@ | Set-Content -Path portable/README.txt
          Compress-Archive -Path portable/* -DestinationPath efxlve-launcher-portable.zip -Force

      - name: Upload the portable Windows build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release upload "v$version" efxlve-launcher-portable.zip --clobber

  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the updater feed to release download URLs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p updater
          # `gh release download` resolves a draft release; the tag REST
          # endpoint can 404 for drafts.
          gh release download "v$version" --pattern latest.json --dir updater --clobber
          node scripts/rewrite-updater-json.mjs "$version" updater/latest.json
          gh release upload "v$version" updater/latest.json --clobber

      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release edit "v$version" --draft=false --latest
