# Manual installer build for the Linux/macOS preview.
#
# This is deliberately separate from `release.yml`: it does not publish a
# GitHub Release and it turns updater artifacts off, so it can run without the
# signing key. Use it to test a real `.deb`/`.rpm`/AppImage or `.app`/`.dmg`
# before the platform matrix is enabled for tagged releases.
#
# Run it from Actions -> Package -> Run workflow.

name: Package

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which installers to build"
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - macos

permissions:
  contents: read

jobs:
  linux:
    if: ${{ inputs.platforms != 'macos' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            pkg-config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers
        run: npm run tauri build -- --config src-tauri/tauri.package.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: efxlve-launcher-linux
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  flatpak:
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: efxlve-launcher-linux
          path: artifacts

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub and runtimes
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Extract the AppImage into the manifest source
        run: |
          set -e
          appimage=$(find artifacts -name '*.AppImage' | head -1)
          test -n "$appimage"
          chmod +x "$appimage"
          mkdir -p flatpak/appimage
          (cd flatpak/appimage && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          shopt -s dotglob
          mv flatpak/appimage/squashfs-root/* flatpak/appimage/
          rmdir flatpak/appimage/squashfs-root

      - name: Build the Flatpak
        run: |
          flatpak-builder --force-clean --repo=repo build-dir flatpak/com.efxlve.launcher.json
          flatpak build-bundle repo efxlve-launcher.flatpak com.efxlve.launcher

      - name: Upload the Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: efxlve-launcher-flatpak
          path: efxlve-launcher.flatpak
          if-no-files-found: error

  macos:
    if: ${{ inputs.platforms != 'linux' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers
        run: npm run tauri build -- --config src-tauri/tauri.package.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: efxlve-launcher-macos
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
