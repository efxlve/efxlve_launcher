# Pull-request and main-branch gate.
#
# The release workflow only runs after a tag; without this file a broken build,
# a locale key mismatch or a failed Rust test could reach `main` unnoticed. The
# job is Windows-only for now because the product is Windows-only; the Linux and
# macOS entries can be added when the platform layer is ready.
#
# `cargo fmt --check` is deliberately not a gate yet: the existing tree predates
# rustfmt in several modules, so the check reports hundreds of unrelated diffs.
# New modules are formatted before commit, and the check can become blocking
# after a dedicated formatting pass.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Frontend unit tests
        run: npm run test

      - name: Locale parity
        run: npm run locales

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
